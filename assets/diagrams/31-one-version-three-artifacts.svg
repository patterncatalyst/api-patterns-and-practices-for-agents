<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="330" y="30" width="400" height="64" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="60.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one Quarkus build</text>
<text x="530.0" y="77.0" font-size="11.5" fill="#555555" text-anchor="middle">pom version compiled in as quarkus.application.version</text>
<rect x="40" y="160" width="300" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="190.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Streamable HTTP</text>
<text x="190.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">initialize: serverInfo.version</text>
<rect x="380" y="160" width="300" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="530.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stdio, docker run -i</text>
<text x="530.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">initialize: serverInfo.version</text>
<rect x="720" y="160" width="300" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">/llms.txt</text>
<text x="870.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">Version: line</text>
<rect x="40" y="280" width="980" height="44" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="530.0" y="307.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same image, same jar, same property: all three report one version</text>
<rect x="30" y="350" width="1000" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="383.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Overriding QUARKUS_MCP_SERVER_SERVER_INFO_VERSION on one stdio invocation reports a</text>
<text x="530.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">different version for that call only; the HTTP handshake and llms.txt still agree with the build, so the three-way match catches exactly that one invocation.</text>
<path d="M480,94 L190,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,94 L530,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M580,94 L870,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="16" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One versioned build, three artifacts that can never report a different version by accident</text>
</svg>