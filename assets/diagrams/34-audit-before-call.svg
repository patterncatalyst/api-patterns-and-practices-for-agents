<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="1060" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">One chokepoint, audit before call</text>
<rect x="50" y="110" width="220" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">model or fixture</text>
<text x="160.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">decides to look up an order</text>
<rect x="340" y="90" width="230" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="455.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AuditedToolCaller</text>
<text x="455.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">the single chokepoint</text>
<rect x="340" y="160" width="230" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="455.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. append first</text>
<text x="455.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">apa.audit.outbound-calls</text>
<rect x="340" y="230" width="230" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="455.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. then call</text>
<text x="455.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">ch13 remote orderStatus</text>
<rect x="650" y="160" width="210" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="755.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">live projection</text>
<text x="755.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">audit.outbound_call_log</text>
<rect x="650" y="230" width="210" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="755.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">business result</text>
<text x="755.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">consumer.outbound_call_result</text>
<rect x="50" y="270" width="230" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="165.0" y="298.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">audit.interceptor.enabled=false</text>
<text x="165.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">call still succeeds, step 1 skipped</text>
<rect x="30" y="340" width="1000" height="24" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="357.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle"></text>
<path d="M270,130 L340,115" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M455,140 L455,160" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M455,210 L455,230" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M570,185 L650,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M570,255 L650,255" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M165,270 L400,170" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="288.5" y="214.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">skips step 1 only</text>
<text x="288.5" y="214.0" font-size="11" fill="#b8650a" text-anchor="middle">skips step 1 only</text>
<text x="550" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Audit first, call second: disabling the interceptor skips only the audit, never the call</text>
</svg>