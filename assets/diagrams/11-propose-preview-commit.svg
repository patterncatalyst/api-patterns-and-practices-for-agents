<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Fire-and-forget</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">dryRun on the same endpoint</text>
<rect x="60" y="110" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /orders/{id}/cancel</text>
<text x="260.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">commits immediately, no preview</text>
<rect x="60" y="200" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the first visible effect</text>
<text x="260.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">is one that can no longer be undone</text>
<rect x="600" y="90" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">dryRun: true</text>
<text x="800.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">ReviewPayload, zero writes, zero events</text>
<rect x="600" y="170" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="196.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit (dryRun absent)</text>
<text x="800.0" y="213.0" font-size="11.5" fill="#555555" text-anchor="middle">order CANCELLED, payment REFUNDED, one event</text>
<rect x="600" y="250" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="800.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">decision: REJECTED_BY_USER: graceful 200 no-op</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Removing the isDryRun() guard lets a preview call commit silently; the real commit after it is then rejected as a duplicate</text>
<path d="M260,166 L260,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,146 L800,170" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,226 L800,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">See the effect before it becomes permanent</text>
</svg>