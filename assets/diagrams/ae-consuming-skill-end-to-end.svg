<text x="260.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">tool only when composed is more than asked;</text>
<text x="260.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">never call a name tools/list does not advertise</text>
