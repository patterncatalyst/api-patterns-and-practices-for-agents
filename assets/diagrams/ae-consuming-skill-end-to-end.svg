<text x="860.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">apa-orders MCP server</text>
<text x="860.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">orderStatus, paymentStatus,</text>
<text x="860.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">shipmentTracking (read-only)</text>
