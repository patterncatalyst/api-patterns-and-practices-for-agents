<text x="790.0" y="70.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">an agent asks: “what is the status of order O-9001?”</text>
<text x="790.0" y="87.5" font-size="11.5" fill="#555555" text-anchor="middle">description text matches, the skill triggers</text>
