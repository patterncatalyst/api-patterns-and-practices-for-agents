<text x="655.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">references/order-operations.md</text>
<text x="655.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">tool fields + status values</text>
<text x="655.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">(loaded for a fields question)</text>
<rect x="795" y="160" width="235" height="85" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912.5" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">references/troubleshooting.md</text>
<text x="912.5" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">what a failure looks like</text>
<text x="912.5" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">(loaded for a failure question)</text>
<rect x="60" y="320" width="300" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
