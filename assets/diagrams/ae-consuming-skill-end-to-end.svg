<text x="366.0" y="276.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">run it directly</text>
<text x="366.0" y="276.5" font-size="11" fill="#555" text-anchor="middle">run it directly</text>
<path d="M360,365 L700,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="536.0" y="359.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">tools/list, then tools/call</text>
<text x="536.0" y="359.0" font-size="11" fill="#555" text-anchor="middle">tools/list, then tools/call</text>
<path d="M700,390 L360,390" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="536.0" y="384.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">result, or a refusal</text>
<text x="536.0" y="384.0" font-size="11" fill="#555" text-anchor="middle">result, or a refusal</text>
<text x="540" y="500" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Progressive disclosure keeps the resident context small</text>
<text x="540" y="522" font-size="11" fill="#555555" text-anchor="middle">Only the front matter is always in context; the body, each reference, and the live server each load only once a question actually calls for them.</text>
