<text x="296.0" y="126.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">triggers</text>
<text x="296.0" y="126.5" font-size="11" fill="#555" text-anchor="middle">triggers</text>
<path d="M265,245 L655,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="466.0" y="196.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">a fields/values question</text>
<text x="466.0" y="196.5" font-size="11" fill="#555" text-anchor="middle">a fields/values question</text>
<path d="M400,245 L900,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="656.0" y="196.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">a failure-mode question</text>
