<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="1000" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">skills/apa-order-ops/ (one source directory)</text>
<rect x="60" y="220" width="460" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="72" y="240" font-size="12" font-weight="700" fill="#888">Project skill channel</text>
<rect x="570" y="220" width="460" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="240" font-size="12" font-weight="700" fill="#888">Packaged channel</text>
<rect x="60" y="80" width="260" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="190.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SKILL.md</text>
<text x="190.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">frontmatter: name, description</text>
<rect x="340" y="80" width="260" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="470.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">references/</text>
<text x="470.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">order-operations.md, troubleshooting.md</text>
<rect x="620" y="80" width="260" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="750.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">scripts/</text>
<text x="750.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">order-status.sh</text>
<rect x="80" y="260" width="420" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="290.0" y="281.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">read directly by a Claude Code session</text>
<text x="290.0" y="298.0" font-size="11.5" fill="#555555" text-anchor="middle">started anywhere under the repo</text>
<rect x="590" y="260" width="420" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="281.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">package-skill.sh zips the same directory</text>
<text x="800.0" y="298.0" font-size="11.5" fill="#555555" text-anchor="middle">into apa-order-ops.skill</text>
<rect x="590" y="320" width="420" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800.0" y="345.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">single top-level entry named for the skill</text>
<rect x="30" y="400" width="1000" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="430.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-status.sh checks the live tools/list before calling an operation.</text>
<text x="530.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">orderStatus for a seeded order returns SHIPPED / FL-778821; deleteOrder, absent from tools/list,</text>
<text x="530.0" y="462.5" font-size="11.5" fill="#555555" text-anchor="middle">is refused, not fabricated, by the same script an agent actually runs.</text>
<path d="M190,130 L190,260" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,130 L800,260" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,306 L800,320" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One skill directory, two distribution channels, one script that refuses to fabricate</text>
</svg>