<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">One at a time</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">In one call</text>
<rect x="60" y="90" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /orders/{id} x 10</text>
<text x="260.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">10 calls, 890 bytes total</text>
<rect x="60" y="190" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /orders (every row)</text>
<text x="260.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">1 call, 3718 bytes, counted client-side</text>
<rect x="60" y="290" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a caller still has to find the hits and the misses itself</text>
<rect x="600" y="90" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /orders/batch-get, 10 ids</text>
<text x="800.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">1 call, 933 bytes, hits keyed by id + notFound</text>
<rect x="600" y="190" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /orders/count?status=PLACED</text>
<text x="800.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">1 call, 2 bytes, a bare number</text>
<rect x="600" y="290" width="400" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no record body ever answers a count question</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Returning the full record list from the count endpoint breaks the guarantee: the body becomes an array, not a number</text>
<path d="M800,146 L800,190" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Two shapes, two measured contrasts, same table</text>
</svg>