<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="1060" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">Outer saga: direct:fulfillOrder (REQUIRES_NEW, timeout)</text>
<rect x="50" y="90" width="280" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="190.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reserve stock</text>
<text x="190.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">compensation: releaseStock</text>
<rect x="390" y="90" width="280" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">take payment</text>
<text x="530.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">compensation: refundPayment</text>
<rect x="730" y="90" width="280" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">agent books a carrier</text>
<text x="870.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">compensation: cancelBooking</text>
<rect x="390" y="180" width="280" height="44" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="530.0" y="200.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payment declined</text>
<text x="530.0" y="217.0" font-size="11.5" fill="#555555" text-anchor="middle">throws, nothing completes</text>
<rect x="50" y="260" width="280" height="44" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="190.0" y="280.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">releaseStock runs</text>
<text x="190.0" y="297.0" font-size="11.5" fill="#555555" text-anchor="middle">undoes the only step enlisted</text>
<rect x="390" y="260" width="280" height="44" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="530.0" y="280.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">refundPayment never runs</text>
<text x="530.0" y="297.0" font-size="11.5" fill="#555555" text-anchor="middle">no payment row was ever written</text>
<rect x="730" y="260" width="280" height="44" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="870.0" y="280.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancelBooking never runs</text>
<text x="870.0" y="297.0" font-size="11.5" fill="#555555" text-anchor="middle">the carrier step never started</text>
<rect x="30" y="340" width="1000" height="24" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="357.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle"></text>
<path d="M330,115 L390,115" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,115 L730,115" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M530,140 L530,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,224 L190,260" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="366.0" y="236.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">compensate in reverse</text>
<text x="366.0" y="236.0" font-size="11" fill="#b8650a" text-anchor="middle">compensate in reverse</text>
<text x="550" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Every compensation is a guarded, idempotent UPDATE: calling it twice changes nothing the second time</text>
<text x="550" y="420" font-size="12" fill="#64748b" text-anchor="middle">Disabling compensation leaves the reserved stock reserved, a partial effect surviving the failure</text>
</svg>