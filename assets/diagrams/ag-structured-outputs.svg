<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="20" width="980" height="590" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="40" font-size="12" font-weight="700" fill="#888">Strongest (top) to weakest (bottom): what actually bounds the model&#x27;s output</text>
<rect x="180" y="70" width="760" height="92" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="106.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. Type the output: Ollama format + JSON Schema, grammar-constrained decoding</text>
<text x="560.0" y="123.5" font-size="11.5" fill="#555555" text-anchor="middle">the model cannot emit a token sequence outside the schema&#x27;s shape</text>
<text x="560.0" y="138.5" font-size="11.5" fill="#555555" text-anchor="middle">this appendix: ExtractedIntent via TypedIntentExtractor</text>
<rect x="180" y="178" width="760" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="560.0" y="214.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. Type the tool surface: capture the tool&#x27;s own structured result</text>
<text x="560.0" y="231.5" font-size="11.5" fill="#555555" text-anchor="middle">the model&#x27;s prose is never the record of what happened</text>
<text x="560.0" y="246.5" font-size="11.5" fill="#555555" text-anchor="middle">the captured-tool-result-not-prose pattern</text>
<rect x="180" y="286" width="760" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="560.0" y="322.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. Validate and repair: check a produced output against a fixed rule</text>
<text x="560.0" y="339.5" font-size="11.5" fill="#555555" text-anchor="middle">catches a wrong decision after the fact, never prevents emitting one</text>
<text x="560.0" y="354.5" font-size="11.5" fill="#555555" text-anchor="middle">the deterministic decision-rule review; the deterministic eval replay</text>
<rect x="180" y="394" width="760" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="560.0" y="430.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. Constrain the input: reject a malformed request before it is processed</text>
<text x="560.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">narrows what reaches the model, not what the model can answer</text>
<text x="560.0" y="462.5" font-size="11.5" fill="#555555" text-anchor="middle">the JSON-schema ingest gate</text>
<rect x="180" y="502" width="760" height="92" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="538.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. Seed and temperature: lower token-level variance</text>
<text x="560.0" y="555.5" font-size="11.5" fill="#555555" text-anchor="middle">narrows which tokens are likely, never which shape is allowed</text>
<text x="560.0" y="570.5" font-size="11.5" fill="#555555" text-anchor="middle">variance reduction, not a consistency guarantee</text>
<path d="M90,116 L90,548" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="96.0" y="326.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">stronger to weaker</text>
<text x="96.0" y="326.0" font-size="11" fill="#b8650a" text-anchor="middle">stronger to weaker</text>
<text x="520" y="648" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Consistency is engineered at the typed boundary, never at the token</text>
<text x="520" y="670" font-size="11" fill="#555555" text-anchor="middle">The same intent yields the same output shape and semantic class on every call because a lever at the top of this map makes the wrong shape unreachable, not because the model behaves.</text>
</svg>