<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Opaque error</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Instructive error (RFC 9457)</text>
<rect x="60" y="110" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">500, text/plain</text>
<text x="260.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;Internal Server Error&quot;</text>
<rect x="60" y="200" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no type, no detail, no remedy</text>
<text x="260.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">an agent has only one fact: it failed</text>
<rect x="600" y="90" width="400" height="72" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="116.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">409, application/problem+json</text>
<text x="800.0" y="133.5" font-size="11.5" fill="#555555" text-anchor="middle">type, title, status, detail</text>
<text x="800.0" y="148.5" font-size="11.5" fill="#555555" text-anchor="middle">currentState: SHIPPED, allowedTransitions: [DELIVERED]</text>
<rect x="600" y="200" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">an agent reads the remedy</text>
<text x="800.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">and decides what to try next</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Removing the @ServerExceptionMapper annotations drops every mapped error back to a bare 500 with no remedy member</text>
<path d="M260,166 L260,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,162 L800,200" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A remedy is not the same information as a status code</text>
</svg>