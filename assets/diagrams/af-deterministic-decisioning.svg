<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="1000" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Model proposes</text>
<rect x="30" y="190" width="1000" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="210" font-size="12" font-weight="700" fill="#888">Rules engine decides</text>
<rect x="60" y="80" width="440" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="280.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Agent proposal</text>
<text x="280.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">orderId, refundAmount, reason</text>
<rect x="560" y="80" width="440" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="780.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No model on the decision path</text>
<text x="780.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">proposes, never decides</text>
<rect x="60" y="230" width="440" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reviewRefund (MCP tool)</text>
<text x="280.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">the agent-facing surface</text>
<rect x="560" y="230" width="440" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="780.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rules/refund-review.drl</text>
<text x="780.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">amount, status, reason clauses, salience-ordered</text>
<rect x="60" y="300" width="940" height="30" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="530.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Same proposal, same rule, same verdict: every time, independent of the model</text>
<rect x="30" y="380" width="1000" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="408.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ReviewRecorder writes an APPROVE or REJECT row naming the failed clause,</text>
<text x="530.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">plus a Micrometer counter and a log line: the verdict is observable, not re-derived.</text>
<path d="M280,130 L280,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,255 L560,255" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M500,330 L500,380" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The model proposes; the committed ruleset decides</text>
</svg>