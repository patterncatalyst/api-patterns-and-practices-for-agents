<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="40" width="600" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="340.0" y="66.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Name</text>
<text x="340.0" y="83.0" font-size="11.5" fill="#555555" text-anchor="middle">the pattern&#x27;s identifier</text>
<rect x="40" y="120" width="600" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="340.0" y="146.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Problem</text>
<text x="340.0" y="163.0" font-size="11.5" fill="#555555" text-anchor="middle">the pressure that breaks the default design</text>
<rect x="40" y="200" width="600" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="340.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Solution</text>
<text x="340.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">one bold sentence stating the rule</text>
<rect x="40" y="280" width="600" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="340.0" y="306.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">How Quarkus and Camel model it</text>
<text x="340.0" y="323.0" font-size="11.5" fill="#555555" text-anchor="middle">the concrete classes, routes, annotations</text>
<rect x="40" y="360" width="600" height="64" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="340.0" y="382.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Build, run, observe</text>
<text x="340.0" y="399.5" font-size="11.5" fill="#555555" text-anchor="middle">the commands, what to watch, the pass count</text>
<text x="340.0" y="414.5" font-size="11.5" fill="#555555" text-anchor="middle">ends with a negative witness</text>
<rect x="40" y="450" width="600" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="340.0" y="476.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">When not to use it</text>
<text x="340.0" y="493.0" font-size="11.5" fill="#555555" text-anchor="middle">the trade-off that argues against the rule</text>
<rect x="40" y="530" width="600" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="340.0" y="553.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">References</text>
<text x="340.0" y="570.0" font-size="11.5" fill="#555555" text-anchor="middle">sources and related pages, never named in running prose</text>
<rect x="700" y="360" width="260" height="100" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="830.0" y="400.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one cross-stack callout</text>
<text x="830.0" y="417.5" font-size="11.5" fill="#555555" text-anchor="middle">names a runnable prompt</text>
<text x="830.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">and a stack-neutral check</text>
<path d="M340,96 L340,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340,176 L340,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340,256 L340,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340,336 L340,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340,424 L340,450" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340,506 L340,530" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640,392 L700,410" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Every pattern page carries these sections, in this order</text>
</svg>