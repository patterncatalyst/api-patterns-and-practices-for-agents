<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Live run</text>
<rect x="570" y="40" width="460" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Replayed fixture</text>
<rect x="60" y="72" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AgentBehaviourAssistant (Ollama)</text>
<text x="260.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">captures Result.toolExecutions()</text>
<rect x="600" y="72" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">committed JSON-lines fixture</text>
<text x="800.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">good-run.jsonl or regressed-run.jsonl</text>
<rect x="230" y="180" width="600" height="54" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="530.0" y="205.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Transcript</text>
<text x="530.0" y="222.0" font-size="11.5" fill="#555555" text-anchor="middle">tool calls, token usage, durable outcome, never model prose</text>
<rect x="280" y="268" width="500" height="42" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="287.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BehaviourEvaluator</text>
<text x="530.0" y="304.0" font-size="11.5" fill="#555555" text-anchor="middle">six ordered assertions, one committed eval spec</text>
<rect x="280" y="322" width="500" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="530.0" y="342.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">first violation wins</text>
<text x="530.0" y="359.5" font-size="11.5" fill="#555555" text-anchor="middle">unexpected-tool-called</text>
<text x="530.0" y="374.5" font-size="11.5" fill="#555555" text-anchor="middle">call-budget-exceeded</text>
<text x="530.0" y="389.5" font-size="11.5" fill="#555555" text-anchor="middle">arg-error-present</text>
<text x="530.0" y="404.5" font-size="11.5" fill="#555555" text-anchor="middle">token-budget-exceeded</text>
<text x="530.0" y="419.5" font-size="11.5" fill="#555555" text-anchor="middle">refund-not-completed</text>
<text x="530.0" y="434.5" font-size="11.5" fill="#555555" text-anchor="middle">final-status-mismatch</text>
<rect x="280" y="460" width="500" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="483.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EvalRecorder</text>
<text x="530.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">durable row, counter and log line, keyed by verdict</text>
<rect x="30" y="525" width="1000" height="45" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="553.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The same committed spec scores a live run and a replayed fixture identically: editing the recorded outcome, not the spec, is what flips a verdict.</text>
<path d="M260,128 L450,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,128 L610,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M530,234 L530,268" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,310 L530,322" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,442 L530,460" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The evaluator scores a live run and a replayed fixture the same way</text>
</svg>