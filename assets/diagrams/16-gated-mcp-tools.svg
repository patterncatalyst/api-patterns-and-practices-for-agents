<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="1000" height="360" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">/mcp, OIDC bearer required</text>
<rect x="60" y="80" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="105.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no bearer token</text>
<rect x="520" y="80" width="200" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="105.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">401, rejected at the HTTP policy</text>
<rect x="60" y="150" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="178.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">bearer token, role agent</text>
<rect x="520" y="150" width="300" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orderSummary</text>
<text x="670.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">read, no scope required</text>
<rect x="60" y="230" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="251.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">bearer token, role agent,</text>
<text x="260.0" y="268.0" font-size="11.5" fill="#555555" text-anchor="middle">scope mcp:tools:write</text>
<rect x="520" y="230" width="300" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="670.0" y="251.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Elicitation confirm</text>
<text x="670.0" y="268.0" font-size="11.5" fill="#555555" text-anchor="middle">accept or decline, before any write</text>
<rect x="520" y="300" width="300" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="321.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancelOrder</text>
<text x="670.0" y="338.0" font-size="11.5" fill="#555555" text-anchor="middle">write, only on accept</text>
<rect x="60" y="330" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">decline returns REJECTED_BY_USER, not an error</text>
<rect x="30" y="420" width="1000" height="46" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="448.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">@PermissionsAllowed(&quot;mcp:tools:write&quot;) splits its value on the first colon and never matches this scope; checking the scope claim by hand sidesteps the collision</text>
<path d="M460,100 L520,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,173 L520,173" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M460,253 L520,253" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,276 L670,300" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Each tool adds its own requirement on top of the endpoint&#x27;s own authentication gate</text>
</svg>