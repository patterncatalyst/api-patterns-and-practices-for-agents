<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Bad contract: getOrder, updateOrderStatus, createRefund</text>
<rect x="570" y="40" width="460" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Good contract: cancelAndRefund(orderId, reason)</text>
<rect x="60" y="90" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">updateOrderStatus(O-1007, CANCELLED)</text>
<text x="260.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">accepted</text>
<rect x="60" y="165" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="191.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">createRefund(guessed amount 25.50)</text>
<text x="260.0" y="208.0" font-size="11.5" fill="#555555" text-anchor="middle">opaque error E400</text>
<rect x="60" y="240" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="266.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">getOrder(O-1007)</text>
<text x="260.0" y="283.0" font-size="11.5" fill="#555555" text-anchor="middle">finds the real amount</text>
<rect x="60" y="315" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="341.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">createRefund(amount, no orderId)</text>
<text x="260.0" y="358.0" font-size="11.5" fill="#555555" text-anchor="middle">opaque error E400</text>
<rect x="60" y="390" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="415.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the agent gives up: order cancelled, customer not refunded</text>
<rect x="600" y="165" width="400" height="64" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="195.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancelAndRefund(O-1007, reason)</text>
<text x="800.0" y="212.0" font-size="11.5" fill="#555555" text-anchor="middle">one call</text>
<rect x="600" y="265" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="291.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order cancelled and the customer refunded</text>
<text x="800.0" y="308.0" font-size="11.5" fill="#555555" text-anchor="middle">in the same call</text>
<rect x="30" y="470" width="1000" height="72" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="504.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Bad contract: 5 tool calls, 2 argument errors, 3185 tokens, refund not completed</text>
<text x="530.0" y="521.0" font-size="11.5" fill="#555555" text-anchor="middle">Good contract: 1 tool call, 0 argument errors, 759 tokens, refund completed</text>
<path d="M260,146 L260,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,221 L260,240" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,296 L260,315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,371 L260,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,229 L800,265" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Same task, same model, two contracts for one business operation</text>
</svg>