<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="390" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Gate (a): contract drift</text>
<rect x="570" y="40" width="460" height="390" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Gate (b): schema compatibility</text>
<rect x="60" y="80" width="400" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Schemathesis (pinned), one-shot container</text>
<text x="260.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">runs the committed OpenAPI contract</text>
<rect x="60" y="150" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">served /q/openapi vs committed contract</text>
<text x="260.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">normalized diff</text>
<rect x="60" y="216" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="237.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">served MCP tools/list vs committed manifest</text>
<text x="260.0" y="254.0" font-size="11.5" fill="#555555" text-anchor="middle">same tool set, same required fields</text>
<rect x="60" y="282" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">drifted fixture bites</text>
<text x="260.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">same checks run again, both now fail</text>
<rect x="60" y="360" width="400" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="260.0" y="383.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">merge blocked: served contract or manifest</text>
<text x="260.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">no longer matches what is committed</text>
<rect x="600" y="80" width="400" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">candidate schema version</text>
<text x="800.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">POSTed straight to Apicurio Registry</text>
<rect x="600" y="150" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">COMPATIBILITY rule: BACKWARD</text>
<text x="800.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">the registry&#x27;s own rule engine checks it</text>
<rect x="600" y="216" width="190" height="56" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="695.0" y="242.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">adds an optional field</text>
<text x="695.0" y="259.0" font-size="11.5" fill="#555555" text-anchor="middle">HTTP 200, accepted</text>
<rect x="810" y="216" width="190" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="905.0" y="242.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">adds a required field</text>
<text x="905.0" y="259.0" font-size="11.5" fill="#555555" text-anchor="middle">HTTP 400, rejected</text>
<rect x="600" y="360" width="400" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="383.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">merge blocked: the registry itself</text>
<text x="800.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">refused the incompatible version</text>
<path d="M260,130 L260,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,196 L260,216" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,262 L260,282" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,338 L260,360" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,130 L800,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M700,196 L700,216" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M900,196 L900,216" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M900,272 L900,360" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Two gates block a merge for two different reasons; each check names which one fired</text>
</svg>