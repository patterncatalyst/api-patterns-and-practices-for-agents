<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Naive 1:1 API-to-MCP wrap</text>
<rect x="570" y="40" width="460" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Tool / resource / prompt triad</text>
<rect x="60" y="80" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="105.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tool: getOrder</text>
<rect x="60" y="136" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="161.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tool: getPayment</text>
<rect x="60" y="192" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="217.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tool: getShipment</text>
<rect x="60" y="260" width="400" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">agent calls all three, assembles the</text>
<text x="260.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">answer itself in its own context</text>
<rect x="600" y="80" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="106.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orderStatus tool</text>
<text x="800.0" y="123.0" font-size="11.5" fill="#555555" text-anchor="middle">composes order + payment + shipment in one call</text>
<rect x="600" y="160" width="190" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="695.0" y="181.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">resource</text>
<text x="695.0" y="198.0" font-size="11.5" fill="#555555" text-anchor="middle">status playbook, fetch once</text>
<rect x="810" y="160" width="190" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="905.0" y="181.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">prompt</text>
<text x="905.0" y="198.0" font-size="11.5" fill="#555555" text-anchor="middle">summarizeOrderStatus</text>
<rect x="600" y="230" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800.0" y="255.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one call, one composed response</text>
<rect x="30" y="400" width="1000" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="428.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Reducing orderStatus to a passthrough of the raw order row still returns O-9001,</text>
<text x="530.0" y="445.0" font-size="11.5" fill="#555555" text-anchor="middle">but the composed payment and shipment fields come back absent: the check that catches it reads the response, not the call.</text>
<path d="M260,120 L260,136" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,176 L260,192" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,232 L260,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M695,136 L695,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M905,136 L905,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Packaging an API as MCP tools means composing for the question, not wrapping each endpoint 1:1</text>
</svg>