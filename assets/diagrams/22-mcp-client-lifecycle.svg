<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Claude Code (interactive session)</text>
<rect x="570" y="40" width="460" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">mcp-client.sh (scripted, deterministic)</text>
<rect x="60" y="80" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="101.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">.mcp.json</text>
<text x="260.0" y="118.0" font-size="11.5" fill="#555555" text-anchor="middle">registers apa-orders over Streamable HTTP</text>
<rect x="60" y="150" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">initialize / notifications/initialized</text>
<text x="260.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">tools, resources, prompts negotiated</text>
<rect x="60" y="220" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="241.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a human question</text>
<text x="260.0" y="258.0" font-size="11.5" fill="#555555" text-anchor="middle">drives whichever tool call answers it</text>
<rect x="60" y="290" width="400" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one transcript, one conversation,</text>
<text x="260.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">not a repeatable check</text>
<rect x="600" y="80" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="101.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same initialize / tools,resources,prompts list</text>
<text x="800.0" y="118.0" font-size="11.5" fill="#555555" text-anchor="middle">read fresh on every run</text>
<rect x="600" y="150" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tools/call for each advertised tool</text>
<text x="800.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">against the seeded order</text>
<rect x="600" y="220" width="400" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="243.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tools/call deleteOrder</text>
<text x="800.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">a name absent from tools/list</text>
<rect x="600" y="290" width="400" height="46" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rejected: isError true or a JSON-RPC error,</text>
<text x="800.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">never a plain successful result</text>
<rect x="30" y="400" width="1000" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="425.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The same MCP surface bounds both columns: a tool tools/list never names cannot be driven,</text>
<text x="530.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">whether the caller is a human session or a scripted check.</text>
<path d="M260,126 L260,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,196 L260,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,266 L260,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,126 L800,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,196 L800,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,270 L800,290" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A human session and a scripted client drive the same lifecycle against the same surface</text>
</svg>