<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="1000" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">/mcp, OIDC bearer required</text>
<rect x="60" y="80" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="101.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">low-assurance token</text>
<text x="260.0" y="118.0" font-size="11.5" fill="#555555" text-anchor="middle">scope mcp:tools:read, no acr claim</text>
<rect x="520" y="80" width="300" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orderSummary</text>
<text x="670.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">read, role agent only</text>
<rect x="520" y="150" width="300" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="670.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancelOrder</text>
<text x="670.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">rejected: missing mcp:tools:write scope</text>
<rect x="60" y="230" width="400" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="251.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RFC 8693 token exchange</text>
<text x="260.0" y="268.0" font-size="11.5" fill="#555555" text-anchor="middle">subject_token = the token above, audience = apa-mcp</text>
<rect x="60" y="300" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="321.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exchanged token</text>
<text x="260.0" y="338.0" font-size="11.5" fill="#555555" text-anchor="middle">scope mcp:tools:write, acr step-up</text>
<rect x="520" y="300" width="300" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="670.0" y="321.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancelOrder</text>
<text x="670.0" y="338.0" font-size="11.5" fill="#555555" text-anchor="middle">scope gate clears</text>
<rect x="520" y="370" width="300" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">acr floor clears, order cancelled</text>
<rect x="30" y="450" width="1000" height="46" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="478.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">STEPUP_ENFORCED=false removes only the acr check; the scope check still runs and still rejects a token missing mcp:tools:write</text>
<path d="M460,103 L520,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,103 L520,173" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="496.0" y="132.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">rejected</text>
<text x="496.0" y="132.0" font-size="11" fill="#555" text-anchor="middle">rejected</text>
<path d="M260,126 L260,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,276 L260,300" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M460,323 L520,323" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,346 L670,370" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A stronger credential, not a stronger caller, is what clears the destructive gate</text>
</svg>