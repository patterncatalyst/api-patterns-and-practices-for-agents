<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Hand-maintained document</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Generated from annotated code</text>
<rect x="60" y="90" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">status: string</text>
<text x="260.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">no enum, no required list, no operationId</text>
<rect x="60" y="170" width="400" height="64" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="200.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a developer forgot to update the document</text>
<text x="260.0" y="217.0" font-size="11.5" fill="#555555" text-anchor="middle">when the field became required</text>
<rect x="60" y="260" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="293.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">an agent discovers the gap only by calling it</text>
<rect x="600" y="90" width="400" height="64" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="120.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">@Schema(required = true), @Schema(enumeration = ...)</text>
<text x="800.0" y="137.0" font-size="11.5" fill="#555555" text-anchor="middle">@Operation(operationId = &quot;placeOrder&quot;)</text>
<rect x="600" y="190" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">openapi: 3.1.x generated on every build</text>
<text x="800.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">committed and diffed against the served document</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Removing the annotations removes the enum, required fields and operationId from the generated document; the code still runs correctly</text>
<path d="M260,146 L260,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,234 L260,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,154 L800,190" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A generated contract cannot drift from the code, because it is the code</text>
</svg>