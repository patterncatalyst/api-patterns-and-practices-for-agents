<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Poll loop (not used here)</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">Event-triggered wakeup</text>
<rect x="60" y="80" width="400" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">agent polls on a fixed interval</text>
<text x="260.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">for a payment it does not yet know happened</text>
<rect x="60" y="160" width="400" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">idle calls while nothing changed,</text>
<text x="260.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">a late reaction when something did</text>
<rect x="600" y="80" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="101.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PaymentWakeupRoute</text>
<text x="800.0" y="118.0" font-size="11.5" fill="#555555" text-anchor="middle">Camel Kafka consumer on apa.payments.processed</text>
<rect x="600" y="150" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="171.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AgentWakeupBean</text>
<text x="800.0" y="188.0" font-size="11.5" fill="#555555" text-anchor="middle">activates a request context for the call</text>
<rect x="600" y="220" width="400" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="241.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ShipmentAdvisor</text>
<text x="800.0" y="258.0" font-size="11.5" fill="#555555" text-anchor="middle">quarkus-langchain4j-ollama, one @Tool</text>
<rect x="600" y="290" width="400" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ShipmentPrepTool.prepShipment</text>
<text x="800.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">durable row, counter, log line, all in one call</text>
<rect x="30" y="390" width="1000" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="420.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Stopping the consumer leaves the event exactly where it fell, never lost: a restarted consumer reads it from the offset it left off at.</text>
<path d="M260,130 L260,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,126 L800,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,196 L800,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,266 L800,290" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The event wakes the agent; the tool call it makes is what the checks observe</text>
</svg>