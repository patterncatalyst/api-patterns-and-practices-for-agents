<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Two independent write-ups</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">One shared ApiMetadata bean</text>
<rect x="60" y="90" width="400" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">/llms.txt hand-maintained</text>
<text x="260.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">names placeOrder, getOrder, cancelOrder</text>
<rect x="60" y="170" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="196.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">/portal hand-maintained, separately</text>
<text x="260.0" y="213.0" font-size="11.5" fill="#555555" text-anchor="middle">names only placeOrder, getOrder</text>
<rect x="60" y="260" width="400" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="286.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the two surfaces disagree</text>
<text x="260.0" y="303.0" font-size="11.5" fill="#555555" text-anchor="middle">which one is right?</text>
<rect x="600" y="90" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ApiMetadata.operations()</text>
<text x="800.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">one list, read by both resources</text>
<rect x="600" y="180" width="190" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="695.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">/llms.txt</text>
<text x="695.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">text/plain</text>
<rect x="810" y="180" width="190" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="905.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">/portal</text>
<text x="905.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">text/html</text>
<rect x="600" y="270" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800.0" y="295.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same operation set on both, always</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Hardcoding one operation line in /llms.txt, bypassing ApiMetadata, names an operation the portal never learns about</text>
<path d="M260,146 L260,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,226 L260,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M695,146 L695,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M905,146 L905,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One source, two renderings, never two sources</text>
</svg>