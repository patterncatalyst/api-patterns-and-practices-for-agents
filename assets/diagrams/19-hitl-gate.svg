<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="1140" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">The gate timeline</text>
<rect x="20" y="270" width="1140" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#888">Three other mechanisms for the same pattern</text>
<rect x="50" y="80" width="190" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">trigger</text>
<text x="145.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">cancel-request</text>
<rect x="270" y="80" width="190" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="365.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">agent classifies</text>
<text x="365.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">reasonCode</text>
<rect x="490" y="80" width="230" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="605.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tool opens the gate</text>
<text x="605.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">PENDING row, pending-decision event</text>
<rect x="750" y="80" width="150" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="825.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">waits</text>
<text x="825.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">no side effect yet</text>
<rect x="930" y="50" width="190" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1025.0" y="71.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">APPROVE</text>
<text x="1025.0" y="88.0" font-size="11.5" fill="#555555" text-anchor="middle">executes exactly once</text>
<rect x="930" y="110" width="190" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1025.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">REJECT</text>
<text x="1025.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">terminal, no side effect</text>
<rect x="50" y="180" width="1070" height="30" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="585.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">both rows and both topic offsets stay unchanged until a decision arrives</text>
<rect x="40" y="310" width="230" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Mechanism</text>
<rect x="280" y="310" width="210" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="385.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Wait duration</text>
<rect x="500" y="310" width="230" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="615.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Durable across restart</text>
<rect x="740" y="310" width="220" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">In-session or out-of-band</text>
<rect x="970" y="310" width="190" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1065.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">State held by</text>
<rect x="40" y="360" width="230" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="390.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">MCP Elicitation</text>
<rect x="280" y="360" width="210" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="385.0" y="390.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">seconds, one turn</text>
<rect x="500" y="360" width="230" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="615.0" y="390.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no, lost on disconnect</text>
<rect x="740" y="360" width="220" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="850.0" y="390.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">in-session</text>
<rect x="970" y="360" width="190" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1065.0" y="390.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the open MCP connection</text>
<rect x="40" y="420" width="230" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">@HumanInTheLoop</text>
<rect x="280" y="420" width="210" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="385.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">minutes, one process</text>
<rect x="500" y="420" width="230" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="615.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no, in-process only</text>
<rect x="740" y="420" width="220" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="850.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">in-session</text>
<rect x="970" y="420" width="190" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1065.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the suspended agentic workflow</text>
<rect x="40" y="480" width="230" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Quarkus Flow emitJson/listen</text>
<rect x="280" y="480" width="210" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="385.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">hours, across restarts</text>
<rect x="500" y="480" width="230" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="615.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">yes, by flowinstanceid</text>
<rect x="740" y="480" width="220" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="850.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">out-of-band</text>
<rect x="970" y="480" width="190" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1065.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the flow engine&#x27;s own store</text>
<rect x="40" y="540" width="230" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="566.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka pending-decision gate</text>
<text x="155.0" y="583.0" font-size="11.5" fill="#555555" text-anchor="middle">(this chapter)</text>
<rect x="280" y="540" width="210" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="385.0" y="573.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">days, no deadline forced</text>
<rect x="500" y="540" width="230" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="615.0" y="573.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">yes, the gate row and topic</text>
<rect x="740" y="540" width="220" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="850.0" y="573.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">out-of-band</text>
<rect x="970" y="540" width="190" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1065.0" y="573.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the PostgreSQL gate row</text>
<rect x="40" y="615" width="1120" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="640.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A redelivered APPROVE claims a PENDING row once; a second delivery finds it already terminal and performs no side effect.</text>
