<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="1060" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">No orchestrator: each agent reacts only to a topic</text>
<rect x="50" y="100" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="180.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order agent</text>
<text x="180.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">places the order, publishes the event</text>
<rect x="420" y="100" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="550.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping agent</text>
<text x="550.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">schedules a shipment, publishes the event</text>
<rect x="790" y="100" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="920.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notification agent</text>
<text x="920.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">writes a notification, terminal</text>
<rect x="50" y="200" width="260" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="180.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">apa.orders.placed</text>
<rect x="420" y="200" width="260" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="550.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">apa.shipping.scheduled</text>
<rect x="420" y="270" width="260" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="550.0" y="291.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">filter() drops the event</text>
<text x="550.0" y="308.0" font-size="11.5" fill="#555555" text-anchor="middle">negative witness, not the default</text>
<rect x="60" y="320" width="980" height="20" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="550.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle"></text>
<path d="M310,128 L420,128" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="371.0" y="122.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">event only</text>
<text x="371.0" y="122.0" font-size="11" fill="#b8650a" text-anchor="middle">event only</text>
<path d="M680,128 L790,128" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="741.0" y="122.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">event only</text>
<text x="741.0" y="122.0" font-size="11" fill="#b8650a" text-anchor="middle">event only</text>
<path d="M180,156 L180,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,156 L550,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,240 L550,270" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="550" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Cutting one link stalls one hop; the agents before it finish their own work regardless</text>
<text x="550" y="410" font-size="12" fill="#64748b" text-anchor="middle">With the filter closed: order recorded, shipment scheduled, notification never written</text>
</svg>