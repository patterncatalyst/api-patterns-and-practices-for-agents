<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">mcp-facade image, MCP tool surface</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">payment-service image, gRPC only</text>
<rect x="60" y="80" width="400" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="105.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">takePayment(orderId, amount=&quot;49.99&quot;)</text>
<rect x="60" y="136" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="157.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AmountReshape.toCents</text>
<text x="260.0" y="174.0" font-size="11.5" fill="#555555" text-anchor="middle">decimal &quot;49.99&quot; to int64 4999</text>
<rect x="60" y="270" width="400" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="291.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AmountReshape.toView</text>
<text x="260.0" y="308.0" font-size="11.5" fill="#555555" text-anchor="middle">int64 cents back to decimal, status text</text>
<rect x="60" y="330" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">agent never sees Protobuf, cents or a gRPC status</text>
<rect x="600" y="80" width="400" height="40" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="800.0" y="105.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PaymentService.takePayment, over a real gRPC channel</text>
<rect x="600" y="136" width="400" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="161.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payments.payments, amounts stored as cents</text>
<rect x="600" y="270" width="400" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="800.0" y="291.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StatusRuntimeException</text>
<text x="800.0" y="308.0" font-size="11.5" fill="#555555" text-anchor="middle">NOT_FOUND, FAILED_PRECONDITION, INVALID_ARGUMENT</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="416.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Skipping the reshape (treating the decimal string as if it were already cents) turns a $49.99 payment into $0.49;</text>
<text x="530.0" y="433.0" font-size="11.5" fill="#555555" text-anchor="middle">a gRPC status left unwrapped reaches the agent as a protocol error instead of an instructive tool error</text>
<path d="M260,120 L260,136" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,159 L600,100" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="536.0" y="123.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">gRPC</text>
<text x="536.0" y="123.5" font-size="11" fill="#b8650a" text-anchor="middle">gRPC</text>
<path d="M800,176 L800,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,293 L460,293" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="536.0" y="287.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">reshape or wrap</text>
<text x="536.0" y="287.0" font-size="11" fill="#b8650a" text-anchor="middle">reshape or wrap</text>
<path d="M260,182 L260,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Reshape at the boundary, never wrap a heterogeneous protocol through unchanged</text>
</svg>