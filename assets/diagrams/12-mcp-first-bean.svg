<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="60" font-size="12" font-weight="700" fill="#888">Three independent implementations</text>
<rect x="570" y="40" width="460" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="582" y="60" font-size="12" font-weight="700" fill="#888">One bean, three delegating faces</text>
<rect x="60" y="90" width="400" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">REST reimplements the read</text>
<rect x="60" y="150" width="400" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GraphQL reimplements the read</text>
<rect x="60" y="210" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">MCP tool reimplements the read, diverges</text>
<rect x="60" y="270" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="295.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">three results, no guarantee they agree</text>
<rect x="600" y="90" width="400" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="116.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderOperations.orderSummary(orderId)</text>
<text x="800.0" y="133.0" font-size="11.5" fill="#555555" text-anchor="middle">the one place the read is implemented</text>
<rect x="600" y="180" width="126" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="663.0" y="205.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">REST</text>
<rect x="737" y="180" width="126" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="205.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GraphQL</text>
<rect x="874" y="180" width="126" height="40" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="937.0" y="205.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">MCP tool</text>
<rect x="600" y="250" width="400" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same input, same result, every time</text>
<rect x="30" y="390" width="1000" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="423.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Diverging one face from OrderOperations breaks cross-face equality; that face still runs, it just no longer agrees with the other two</text>
<path d="M260,130 L260,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,190 L260,210" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M260,250 L260,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M663,146 L663,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,146 L800,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M937,146 L937,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="26" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One bean behind three transports never drifts, because it never duplicates</text>
</svg>