---
# DRIFTED copy of 07-order-service.openapi.yaml, used only by
# examples/27-contract-and-manifest-conformance as a biting negative witness. It describes a
# contract the running ch07 service does NOT satisfy, so conformance checks against it must fail:
#   - OrderResponse gains a required `trackingCode` field the service never returns (tightened schema).
#   - POST /orders drops its documented 400 response and GET /orders/{id} drops its documented 404,
#     so the service's real problem+json error codes become undocumented status codes.
# Never served by any app; this file exists so the harness can prove its conformance checks discriminate.
openapi: 3.1.0
components:
  schemas:
    OrderCreateRequest:
      type: object
      required:
      - customerId
      - itemSku
      - quantity
      - amount
      properties:
        customerId:
          type: string
          description: The ordering customer's id.
        itemSku:
          type: string
          description: The ordered item's SKU.
        quantity:
          type: integer
          format: int32
          description: How many units of the item.
        amount:
          type: number
          description: "The order total, two decimals."
    OrderResponse:
      type: object
      required:
      - trackingCode
      properties:
        orderId:
          type: string
          description: The order id.
        customerId:
          type: string
          description: The ordering customer's id.
        itemSku:
          type: string
          description: The ordered item's SKU.
        quantity:
          type: integer
          format: int32
          description: How many units of the item.
        amount:
          type: number
          description: "The order total, two decimals."
        trackingCode:
          type: string
          description: Tightened drift field the running service never returns.
        status:
          type: string
          description: The order's lifecycle state.
          enum:
          - PLACED
          - PAID
          - SHIPPED
          - DELIVERED
          - CANCELLED
    Problem:
      type: object
      properties:
        title:
          type: string
          description: "A short, human-readable summary of the problem."
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: A detail specific to this occurrence of the problem.
paths:
  /orders:
    post:
      summary: Place a new order.
      description: Creates an order and publishes OrderPlaced. Every field in the
        request body is required.
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
        required: true
      responses:
        "201":
          description: The order was placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
      tags:
      - Order Resource
  /orders/{id}:
    get:
      summary: Look up an order by id.
      description: "Returns the order's current state, including its lifecycle status."
      operationId: getOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
      tags:
      - Order Resource
info:
  title: Order Service
  version: 1.0.0
  description: "Agent-facing order service: place an order and look one up by id."
