quarkus.application.name=domain-split-progressive-discovery

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (orders.orders, shipping.shipments), so no currentSchema/search_path is set
# here. Only the two schemas this example's two domain servers own are migrated: no payments,
# no inventory, no notifications, the point of a domain-split example being one server per
# schema it is allowed to touch.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders,shipping
quarkus.flyway.default-schema=orders

# Two named @McpServer domain servers in one deployment: `order` and `shipping`. Each
# quarkus.mcp.server.<name>.* config tree is independent; the HTTP transport's root-path
# defaults to the literal "/mcp" for EVERY server name (confirmed in the quarkus-mcp-server-http
# 2.0.4 jar: McpHttpServerBuildTimeConfig.Http.rootPath has @WithDefault("/mcp") with no
# server-name substitution), so two named HTTP servers collide on the same path unless each is
# given its own root-path explicitly, as done here. There is no third, unnamed "<default>"
# server bean in this example, so the bare /mcp root path is never bound to anything.
quarkus.mcp.server.order.http.root-path=/mcp/order
quarkus.mcp.server.shipping.http.root-path=/mcp/shipping

# stdio has no per-server-name config tree (quarkus-mcp-server-stdio 2.0.4's
# McpStdioRuntimeConfig is a single, unnamed @ConfigMapping, prefix "quarkus.mcp.server.stdio"):
# it stays the extension default for a direct, attached `java -jar` consumer. The compose
# container runs detached (`-d`) with no stdin attached, so the stdio reader hits immediate EOF
# and shuts the application down a few seconds after start; disabled only in that prod,
# detached context, carrying forward ch12/ch13's exact fix.
%prod.quarkus.mcp.server.stdio.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
