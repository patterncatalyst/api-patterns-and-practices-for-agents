quarkus.application.name=agent-behaviour-eval

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
# This example owns no other tables in the shared apa database, so it keeps its Flyway history
# isolated in its own schema, the same discipline 26-decision-rule-review's `review` schema uses.
quarkus.flyway.schemas=eval
quarkus.flyway.default-schema=eval

# The eval spec as data: BehaviourEvaluator reads this committed JSON file once at startup and
# never calls a model to decide PASS or FAIL. agent.eval.spec.path is demo code, like
# 26-decision-rule-review's review.rule.path: in dev and test, mvn runs with this module as the
# working directory, so the relative path resolves straight to the repo-root contracts/ directory;
# in prod the path is absolute, resolved inside the container against the bind-mounted contracts/
# directory compose.yaml wires up.
agent.eval.spec.path=../../contracts/28-behaviour-eval.json
%prod.agent.eval.spec.path=${AGENT_EVAL_SPEC_PATH:/deployments/contracts/28-behaviour-eval.json}

# MODEL=off reconciliation: agent.eval.model-source picks where GET /eval/run/good's transcript
# comes from. "fixture" (the default everywhere, forced again in %test so no environment override
# can change it) replays the committed good-run.jsonl, so mvn -B verify and the default verify.sh
# lane never need Ollama. "ollama" (set only by verify.sh's LIVE=1 lane, via
# AGENT_EVAL_MODEL_SOURCE) drives the real model through LiveRunner instead. See EvalRoute.
agent.eval.model-source=${AGENT_EVAL_MODEL_SOURCE:fixture}
%test.agent.eval.model-source=fixture

quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0.0
quarkus.langchain4j.ollama.chat-model.seed=42
quarkus.langchain4j.ollama.timeout=120s
# Tests never reach LiveRunner (agent.eval.model-source is forced to "fixture" above), so Ollama
# Dev Services, which would try to pull a model, stays off.
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
