quarkus.application.name=replayable-agent-memory-event-sourced-audit

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# The live projection's own consumer group; auto-offset-reset=earliest is set per-route
# (AuditProjectionRoute), not here, since it is a Kafka consumer URI option, not a component
# default this chapter needs anywhere else.
audit.projection.group-id=audit-projection

# ReplayService opens its own short-lived, disposable-group-id plain KafkaConsumer (never the
# projection route's own camel.component.kafka.brokers), so it needs the broker address under
# its own property. kafka.bootstrap.servers is set by Kafka Dev Services in tests; compose has
# no Dev Services, so %prod falls back to the same CAMEL_COMPONENT_KAFKA_BROKERS the Camel Kafka
# component uses.
audit.kafka.bootstrap-servers=${kafka.bootstrap.servers:kafka:9094}
%prod.audit.kafka.bootstrap-servers=${CAMEL_COMPONENT_KAFKA_BROKERS:kafka:9094}

# Demo code: true lets POST /audit/demo/mutate overwrite a committed projection row in place,
# without appending a correcting record to the log. false (the default) rejects the call with
# 403: the whole point of this chapter is that the log, not the projection, is the durable
# record, so the projection is never written to except by folding the log.
audit.mutable=false
%prod.audit.mutable=${AUDIT_MUTABLE:false}

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (shipping.audit_log_projection, shipping.audit_replay), so no
# currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=shipping
quarkus.flyway.default-schema=shipping

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
