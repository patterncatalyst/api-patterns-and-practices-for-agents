{{- if .Values.apicurio.enabled }}
# Apicurio Registry: the live BACKWARD compatibility gate project-checks.sh
# drives (reusing examples/32-ci-for-agent-facing-apis's own mechanism
# against the cluster's own registry, exactly as
# examples/38-final-project-data-mesh/verify.sh does on minikube). Image,
# in-memory h2 storage (matching examples/_infra/compose.yaml's own dev-scale
# setup) and probes mirror examples/_k8s/setup-apicurio.sh exactly.
#
# Deliberately not built from chart.podTemplate: Apicurio never joins the
# mesh (no istio.io/rev label), the same as Postgres, Kafka, Ollama and
# otel-lgtm (install-mesh.sh: "No namespace-wide injection: Kafka, Postgres,
# otel-lgtm and Jobs stay out").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio
        app.kubernetes.io/part-of: {{ .Release.Name }}
    spec:
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image }}
          env:
            - {name: APICURIO_STORAGE_KIND, value: "sql"}
            - {name: APICURIO_STORAGE_SQL_KIND, value: "h2"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /apis/registry/v3/system/info, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/ready, port: management}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
          {{- include "chart.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: apicurio
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# capture-evidence.sh's generic Route loop (step 3/6) probes every Route's
# health-check-path, so this needs no project-specific wiring beyond the
# annotation below.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    health-check-path: /apis/registry/v3/system/info
spec:
  to:
    kind: Service
    name: apicurio
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
