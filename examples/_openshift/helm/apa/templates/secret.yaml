{{- if .Values.postgres.enabled }}
# Postgres credentials. Both passwords are generated once at install and kept
# across upgrades via lookup; neither is ever written to values, files or
# evidence. Under Argo CD (helm template) lookup returns nothing, so the
# Application must ignoreDifferences on /data/password and /data/adminPassword
# (install-gitops.sh).
#
# adminPassword is the postgres superuser's password (POSTGRESQL_ADMIN_PASSWORD
# in postgres.yaml): the sclorg image leaves that account reachable only from
# localhost with no password otherwise, so the per-product database init Job
# (templates/postgres-databases.yaml), which connects from its own pod, needs
# it to CREATE DATABASE. Adapted from the skill's single-database chart,
# which has no superuser credential at all (one app role, one database,
# created by the image's own POSTGRESQL_DATABASE/_USER/_PASSWORD at first
# start is enough there).
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres-app" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-app
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  {{- if $secret }}
  password: {{ index $secret.data "password" | quote }}
  adminPassword: {{ index $secret.data "adminPassword" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  adminPassword: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
