# values.yaml — apa on OpenShift Local: Appendix B's run of ch38's final-project
# data mesh (three agent-facing data products, five Deployments) on OpenShift-
# native mechanisms.
#
# Keep the env contract (ConfigMap keys, Service and Secret names) the same
# as the project's other runtimes (compose/minikube), so the services' %prod
# configuration works unchanged. Only the JDBC host (an OpenShift Service
# name instead of apa-postgres-rw.apa-data.svc.cluster.local) and the image
# source (built in-cluster, never pulled) differ; see each service's own
# `env:` below.

# Images come from the internal registry: build-images.sh pushes ImageStream
# tags <service>:<imageTag> into the release namespace.
registry: image-registry.openshift-image-registry.svc:5000
imageTag: v1

# The ubi10/openjdk-25 S2I image starts the app with run-java.sh, which sets
# -XX:MaxRAMPercentage from JAVA_MAX_MEM_RATIO (default 80). 50 leaves room
# for metaspace, threads and buffers inside the limits below. The image
# ignores JAVA_MAX_RAM_RATIO.
javaMaxMemRatio: "50"

# Extra keys for the shared ConfigMap (<release>-app-config).
config: {}

kafka:
  enabled: true
  # Kafka CR name (openshift/infra/kafka.yaml); bootstrap <cluster>-kafka-bootstrap:9092.
  # Topic apa.payments.processed auto-creates on kcat's first produce
  # (infra/kafka.yaml: auto.create.topics.enable), exactly as in ch38's own
  # verify.sh against the minikube/compose Kafka: no reused app in this mesh
  # publishes the event itself (recon in examples/38-final-project-data-mesh/
  # verify.sh), so kcat over `oc exec` stands in for the payments product's
  # async output port.
  cluster: apa

postgres:
  enabled: true
  # Red Hat image built for arbitrary UIDs (restricted-v2). Newest UBI first,
  # exact tag; re-check with skopeo list-tags (references/versions.md).
  image: registry.redhat.io/rhel10/postgresql-16:10.2-1791491499
  # The image's own bootstrap database (POSTGRESQL_DATABASE/_USER), unused by
  # any data-mesh service directly: every service below points its own
  # QUARKUS_DATASOURCE_JDBC_URL at its own product database instead (see
  # `databases` next), matching ch38's domain-ownership rule (Dehghani
  # principle 1): no service's Deployment points at another product's
  # database.
  database: apa
  username: apa
  storage: 2Gi
  # Adapted from the skill's single-database chart: ch38's data mesh needs
  # one database per deployable (orders, payments, shipping, shipping_track),
  # each owned by the apa role, mirroring
  # examples/38-final-project-data-mesh/verify.sh's own MESH_DATABASES. A
  # post-install/post-upgrade Helm hook Job (templates/postgres-databases.yaml)
  # creates whatever is missing here, as the postgres superuser; it never
  # drops or resets a database (additive only), unlike verify.sh's own
  # DROP-then-CREATE reset, which belongs to project-checks.sh's fresh-run
  # contract, not to a chart install.
  databases:
    - orders
    - payments
    - shipping
    - shipping_track

apicurio:
  enabled: true
  # Added to the skill's core (the skill ships no schema-registry template):
  # ch38's governance witness needs a live Apicurio to register schemas
  # against. No operator for Apicurio exists on the redhat-operators catalog
  # surveyed for this skill (references/operators.md's six operators do not
  # include one), so this is the "else a chart/manifest deploy" path: a plain
  # Deployment, matching examples/_k8s/setup-apicurio.sh's own image, storage
  # mode (in-memory h2, the same dev-scale setup examples/_infra/compose.yaml
  # uses) and probes exactly, reached through its own edge-TLS Route.
  image: quay.io/apicurio/apicurio-registry:3.3.4

# ── Platform tier (openshift/platform/) ─────────────────────────────────────
# All off by default: a plain install renders only the core above.

# OpenShift Service Mesh 3. Pods join through the istio.io/rev LABEL (Sail's
# revisioned injection); namespace mTLS is STRICT, and every service with a
# Route is PERMISSIVE because the router delivers plaintext to it.
mesh:
  enabled: false
  revision: default
  canary:
    enabled: false
    service: orders
    v2Weight: 10

# Custom Metrics Autoscaler: a Kafka-lag ScaledObject for every service
# that has a `keda:` block below. shipping-writer is the one event-driven
# deployable in this mesh (it wakes on apa.payments.processed): its own
# `keda:` block below is this project's real use of the flag, not a
# commented-out example.
keda:
  enabled: false

# Red Hat build of OpenTelemetry: the operator can inject its own Java agent
# into JVM pods via the chart's per-service `instrument` field (default
# true). Every service in this mesh already carries its own
# quarkus-opentelemetry + quarkus-micrometer-opentelemetry extensions
# (native OTel SDK, the same one every other runtime in this book uses), so
# all five set `instrument: false` below: injecting the operator's agent on
# top would run two competing OTel SDKs in one JVM. otel-lgtm still deploys
# (Tempo/Loki/Prometheus/Grafana) and every service's own
# QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT (templates/config.yaml) points at it
# directly, exactly as examples/_k8s/base/config.yaml does for the other
# Kubernetes runtime.
observability:
  enabled: false
  lgtmImage: docker.io/grafana/otel-lgtm:0.41.0

# One service as a native executable (platform/build-native.sh pushes
# <service>-native:<imageTag>). orders is read-only and has no gRPC client or
# Camel route to complicate a native build, the same reason it is also the
# default canary target above.
native:
  enabled: false
  service: orders

# Ollama under restricted-v2, plus every service with `ai: true`. Image and
# model match examples/_k8s/setup-ollama.sh's own pins exactly (the project's
# existing minikube runtime), not the lgtm-crc skill's older default
# (0.35.1, qwen2.5:3b): the model is the one
# examples/17-event-triggered-agent-wakeup's own application.properties pins
# (quarkus.langchain4j.ollama.chat-model.model-id), so the writer's
# ShipmentAdvisor AiService gets the exact model it was tested against on
# every runtime.
ai:
  enabled: false
  ollamaImage: "docker.io/ollama/ollama:0.40.16@sha256:a372a1c0d1e15b68e9521189785c3ca17795c26c2356f8b1b10122cfb59ed0d7"
  model: "qwen3:4b-instruct-2507-q4_K_M"
  storage: 10Gi

# One Deployment + Service per entry. Keys are the ImageStream names
# build-images.sh forces with -Dquarkus.container-image.name (every module's
# own Maven artifactId differs from its data-mesh product name) and must
# match SERVICES/MODULE_DIR in openshift/lib.sh (AI services excepted).
#   route:           edge-TLS Route (and mesh PERMISSIVE for this service)
#   routeHealthPath: path capture-evidence.sh checks through the Route
#   db:              Postgres credentials + a wait-for-postgres init container
#   javaToolOptions: JVM -D flags the image's Containerfile used to set
#                    (run-java.sh never reads that Containerfile)
#   grpcPort:        extra container + Service port
#   env:             service-specific environment
#   ai:              deployed only when ai.enabled
#   probe: tcp       no SmallRye Health extension; probe the HTTP port
#   instrument:      false to skip Java-agent injection
#   keda:            {topic, consumerGroup, lagThreshold, minReplicas, maxReplicas}
services:
  # orders = examples/13-package-api-as-mcp-tools. Composes a status across
  # three schemas (orders, payments, shipping) inside its OWN "orders"
  # database (seeded by project-checks.sh, mirroring ch38); it never touches
  # the payments or shipping_track/shipping databases below. MCP at /mcp.
  # READ-only.
  orders:
    route: true
    db: true
    instrument: false
    javaToolOptions: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    env:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://apa-postgres-rw:5432/orders"
    resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 512Mi}}

  # payments-facade = examples/15-reshape-grpc-behind-facade/mcp-facade. MCP
  # at /mcp; no database of its own (payment state lives behind the gRPC
  # call, in payment-service's own "payments" database); calls
  # payment-service by its in-cluster Service name.
  payments-facade:
    route: true
    instrument: false
    javaToolOptions: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    env:
      PAYMENT_SERVICE_GRPC_HOST: "payment-service"
      PAYMENT_SERVICE_GRPC_PORT: "9000"
    resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 512Mi}}

  # payment-service = examples/15-reshape-grpc-behind-facade/payment-service.
  # Internal only: no `route`, so templates/routes.yaml renders nothing for
  # it and it is reached only by the facade's gRPC client, by Service name,
  # or by project-checks.sh over `oc exec`. Owns the "payments" database.
  payment-service:
    db: true
    grpcPort: 9000
    instrument: false
    javaToolOptions: "-Dquarkus.http.host=0.0.0.0 -Dquarkus.grpc.server.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    env:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://apa-postgres-rw:5432/payments"
    resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 512Mi}}

  # shipping-track = examples/14-domain-split-progressive-discovery. Two
  # named MCP servers in one deployment (order at /mcp/order, shipping at
  # /mcp/shipping); only the shipping one is this product's agent-facing
  # surface (order-history lookups belong to the orders product). Owns the
  # "shipping_track" database (its own seeded read copy, separate from the
  # writer's "shipping" database below, so their independent Flyway
  # histories never collide). READ-only.
  shipping-track:
    route: true
    db: true
    instrument: false
    javaToolOptions: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    env:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://apa-postgres-rw:5432/shipping_track"
    resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 512Mi}}

  # shipping-writer = examples/17-event-triggered-agent-wakeup, reused
  # unchanged. No tool surface, no Route: health-only HTTP, woken by
  # consuming apa.payments.processed. Owns the "shipping" database (its own
  # shipment_prep table). Calls Ollama (langchain4j AiService), hence
  # `ai: true`: deployed only when ai.enabled, built in-cluster like every
  # other service, with Ollama and the pinned model.
  shipping-writer:
    db: true
    ai: true
    instrument: false
    javaToolOptions: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    env:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://apa-postgres-rw:5432/shipping"
      QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL: "http://ollama:11434"
      WAKEUP_CONSUMER_ENABLED: "true"
    keda:
      topic: apa.payments.processed
      consumerGroup: shipping-wakeup
      lagThreshold: "5"
      minReplicas: 0
      maxReplicas: 3
    resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 512Mi}}
