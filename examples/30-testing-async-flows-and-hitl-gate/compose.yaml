name: apa-30

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  # The subject under test: chapter 19's human-in-the-loop cancel-and-refund gate, built from
  # its own Containerfile and build context (examples/, so the shared domain model installs
  # first, exactly as ch19's own compose.yaml does). Reused unchanged; this example owns no app
  # code. The harness in verify.sh tests the async flow AND its gate the way any contract is
  # tested: by observing the durable effect (rows and topic offsets), never an exit code.
  app:
    build:
      context: ..
      dockerfile: 19-human-in-the-loop-gate/Containerfile
    container_name: apa-30-human-in-the-loop-gate
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
      QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
