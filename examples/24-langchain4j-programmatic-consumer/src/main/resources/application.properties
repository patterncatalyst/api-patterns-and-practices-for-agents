quarkus.application.name=langchain4j-programmatic-consumer

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
# This example runs ALONGSIDE the ch13 MCP server against the shared Postgres, so its Flyway
# history must live in its own schema, not the `orders` schema ch13 owns. Sharing a default
# schema would make this app's Flyway validate against ch13's migration history and fail.
quarkus.flyway.schemas=consumer
quarkus.flyway.default-schema=consumer

# The direct quarkus-langchain4j path (never the Camel langchain4j-agent component):
# OrderStatusConsumerAgent, a @RegisterAiService interface, has one method annotated
# @McpToolBox("apa-orders"), which registers ch13's package-api-as-mcp-tools server's tools as
# remote tools the model may call. agent.consumer.model-source picks the path: "ollama" (the
# default, and what compose and the live verify.sh always use) lets the real model call the
# remote orderStatus tool over MCP and then the local recordConsultation tool; "fixture" (forced
# by the %test profile, MODEL=off) routes to FixtureConsumer, which calls the same remote MCP
# endpoint directly through a hand-built McpClient (bypassing the model entirely) and records the
# same effect, so mvn -B verify and CI never need Ollama.
agent.consumer.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by
# default: see _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# The remote MCP client for ch13's package-api-as-mcp-tools server, confirmed live against the
# resolved quarkus-langchain4j-mcp 1.13.4 jar (io.quarkiverse.langchain4j.mcp.runtime.McpToolBox,
# McpClientBuildTimeConfig, McpClientRuntimeConfig; see _plans/versions.md). Streamable HTTP, the
# same transport ch13 serves at /mcp (rootPath default). The live compose stack points this at the
# package-api-as-mcp-tools service; %test points it at a tiny in-process MCP server
# (FixtureOrderStatusMcpServer, quarkus-mcp-server-http, test scope only) exposing an equivalent
# orderStatus tool on this same app's own /mcp endpoint, so mvn -B verify never needs the real ch13
# container.
quarkus.langchain4j.mcp.apa-orders.transport-type=streamable-http
%prod.quarkus.langchain4j.mcp.apa-orders.url=${QUARKUS_LANGCHAIN4J_MCP_APA_ORDERS_URL:http://package-api-as-mcp-tools:8080/mcp}
%test.quarkus.langchain4j.mcp.apa-orders.url=http://localhost:${quarkus.http.test-port:8081}/mcp
quarkus.langchain4j.mcp.apa-orders.tool-execution-timeout=30s

# Tests never call Ollama: MODEL=off, the agent step calls the remote MCP tool directly instead
# (see ConsumerBean, FixtureConsumer).
%test.agent.consumer.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
