name: apa-29

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  # The target: ch07's strict-self-describing-contract order service, built from its own
  # Containerfile and build context (examples/, so it installs the shared domain model first,
  # exactly like ch07's own compose.yaml). Reused unchanged; this example never copies or forks
  # its code. Published to the host (127.0.0.1:8080) for manual inspection, but the scripted
  # Newman run reaches it by compose service DNS (strict-self-describing-contract:8080) on the
  # apa network, not through the host port.
  strict-self-describing-contract:
    build:
      context: ..
      dockerfile: 07-strict-self-describing-contract/Containerfile
    container_name: apa-29-strict-self-describing-contract
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
