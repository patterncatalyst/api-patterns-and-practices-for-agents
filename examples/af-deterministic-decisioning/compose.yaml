name: apa-af

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  app:
    build:
      context: ..
      dockerfile: af-deterministic-decisioning/Containerfile
    container_name: apa-af-deterministic-decisioning
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
      # Demo code: the negative witness. Left at its default, RefundReviewer compiles the real
      # committed ruleset, amount-ceiling rule intact. Pointed at the weakened classpath
      # resource (the same ruleset with that rule removed), the SAME over-limit proposal is
      # approved instead of rejected, proving the rule is exactly what caught it. Both DRL
      # files ship inside the built image (src/main/resources/rules/), so flipping this only
      # needs a container recreate, never a rebuild or a bind mount.
      REVIEW_RULE_RESOURCE: ${REVIEW_RULE_RESOURCE:-rules/refund-review.drl}
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
