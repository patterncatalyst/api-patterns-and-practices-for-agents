name: apa-33

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  app:
    build:
      context: ..
      dockerfile: 33-observability-for-agent-traffic/Containerfile
    container_name: apa-observability-for-agent-traffic
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
      QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL: http://ollama:11434
      # Demo code: false stops TokenCostRecorder from writing the durable token_cost row (the
      # negative witness in verify.sh). The GenAI span and token-usage metric the framework
      # emits on its own are unaffected either way.
      COST_RECORDER_ENABLED: ${COST_RECORDER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
