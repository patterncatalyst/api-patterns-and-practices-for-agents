quarkus.application.name=observability-for-agent-traffic

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same minor instead. Every statement is
# schema-qualified (agenttraffic.token_cost), so no currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=agenttraffic
quarkus.flyway.default-schema=agenttraffic

# Ollama: the direct quarkus-langchain4j-ollama path (no Camel anywhere in this example).
# agent.traffic.model-source picks the decision path: "ollama" lets the OrderStatusAdvisor
# AiService call the real model and its orderStatus tool, with TokenCostRecorder reading the
# real token counts off the chat model's own request/response listener callback; "fixture"
# (MODEL=off, forced below for tests) skips the model and the tool entirely and replays a
# committed, recorded token count from fixtures/token-usage.jsonl straight into
# TokenCostRecorder, so mvn -B verify and CI never need a model. The live verify.sh always runs
# with agent.traffic.model-source=ollama, the pinned qwen3 model.
agent.traffic.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by
# default: see _plans/versions.md, "OTel GenAI semantic conventions". Never set these true.
quarkus.langchain4j.tracing.include-prompt=false
quarkus.langchain4j.tracing.include-completion=false
quarkus.langchain4j.tracing.include-tool-arguments=false
quarkus.langchain4j.tracing.include-tool-result=false
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests never call Ollama: MODEL=off, the agent step reads the committed fixture instead
# (see AgentTrafficBean, FixtureTokenUsageAdvisor, fixtures/token-usage.jsonl).
%test.agent.traffic.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true

# Demo code: the negative witness in verify.sh. false stops TokenCostRecorder from writing the
# durable token_cost row (and from incrementing its own counter and logging its own line); the
# GenAI span and the gen_ai.client.token.usage metric the framework emits on its own are
# unaffected either way, since they come from quarkus-langchain4j's own listener, not from this
# flag.
cost.recorder.enabled=true

# Fixed per-1000-token USD rates TokenCostRecorder derives a call's cost from. Illustrative,
# documented here rather than guessed at in code: $0.0005 per 1000 input tokens, $0.0015 per
# 1000 output tokens.
cost.recorder.rate.input-per-1k=0.0005
cost.recorder.rate.output-per-1k=0.0015
