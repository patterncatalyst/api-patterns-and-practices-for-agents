quarkus.application.name=auditing-ai-using-code

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# The live projection's own consumer group; auto-offset-reset=earliest is set per-route
# (AuditProjectionRoute), not here.
audit.projection.group-id=audit-outbound-projection

# ReplayService opens its own short-lived, disposable-group-id plain KafkaConsumer (never the
# projection route's own camel.component.kafka.brokers), so it needs the broker address under its
# own property. kafka.bootstrap.servers is set by Kafka Dev Services in tests; compose has no Dev
# Services, so %prod falls back to the same CAMEL_COMPONENT_KAFKA_BROKERS the Camel Kafka
# component uses.
audit.kafka.bootstrap-servers=${kafka.bootstrap.servers:kafka:9094}
%prod.audit.kafka.bootstrap-servers=${CAMEL_COMPONENT_KAFKA_BROKERS:kafka:9094}

# Append-only guard (21-replayable-agent-memory-event-sourced-audit precedent): false (the
# default) rejects a demo mutate attempt against the projection with 403. true lets it overwrite a
# committed row in place, without appending a correcting record to the log: only for this
# chapter's own append-only-guard demonstration.
audit.mutable=false
%prod.audit.mutable=${AUDIT_MUTABLE:false}

# The biting negative witness: true (the default) makes AuditedToolCaller append an audit record
# before every outbound call it makes. false lets the outbound call still succeed, with no audit
# record appended for it, so the chapter's checks can prove the audit step, not just the call
# itself, actually ran.
audit.interceptor.enabled=true
%prod.audit.interceptor.enabled=${AUDIT_INTERCEPTOR_ENABLED:true}

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand image,
# which needs its own entrypoint and is not Dev-Services-compatible). Dev Services (tests) runs
# the plain postgres image at the same 18.6 minor instead. Every statement is schema-qualified
# (audit.outbound_call_log, consumer.outbound_call_result), so no currentSchema/search_path is set
# here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
# ch13 owns orders/payments/shipping; this app owns a separate audit schema for the append-only
# log's own projection and a separate consumer schema for the business result an outbound call
# produced, so sharing the stack Postgres never collides with ch13's Flyway history or tables.
quarkus.flyway.schemas=audit,consumer
quarkus.flyway.default-schema=audit

# The direct quarkus-langchain4j path (never the Camel langchain4j-agent component):
# agent.outbound.model-source picks the decision path. "ollama" (the default, and what compose
# and the live verify.sh always use) lets the real model decide to call AuditedToolCaller itself;
# "fixture" (forced by the %test profile, MODEL=off) calls that same audited method directly, with
# no model involved, so mvn -B verify and CI never need Ollama.
agent.outbound.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by default: see
# _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# AuditedToolCaller's own hand-built McpClient target: ch13's package-api-as-mcp-tools server in
# compose; an in-process FixtureOrderStatusMcpServer (quarkus-mcp-server-http, test scope only) on
# this app's own /mcp endpoint under %test, so mvn -B verify never needs the live ch13 container.
%prod.outbound.mcp.target-url=${OUTBOUND_MCP_TARGET_URL:http://package-api-as-mcp-tools:8080/mcp}
%test.outbound.mcp.target-url=http://localhost:${quarkus.http.test-port:8081}/mcp

# Tests never call Ollama: MODEL=off (see agent.outbound.model-source above).
%test.agent.outbound.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
