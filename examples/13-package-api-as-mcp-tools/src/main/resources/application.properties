quarkus.application.name=package-api-as-mcp-tools

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (orders.orders, payments.payments, shipping.shipments), so no
# currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

# Composing a status across three services means three schemas. `create-schemas` (the Quarkus
# Flyway default) creates all three before the migrations run: a no-op against the live stack,
# where examples/_infra/postgres/init/01-schemas.sql already created them, and the only way a
# fresh Dev Services database gets them for tests.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders,payments,shipping
quarkus.flyway.default-schema=orders

# The MCP tool/resource/prompt surface: Streamable HTTP at the quarkus-mcp-server-http default
# root path (/mcp), confirmed live and recorded in _plans/versions.md. stdio is how an agent's own
# process consumes this example directly (java -jar, attached to a terminal); it needs no
# HTTP-reachable port. The compose container runs detached (`-d`), so it has no stdin attached:
# quarkus-mcp-server-stdio's reader hits immediate EOF there and shuts the application down a few
# seconds after start. Disabled only in prod mode, where the container is the compose service;
# stdio stays enabled (the extension default) for a direct, attached `java -jar` run.
%prod.quarkus.mcp.server.stdio.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
