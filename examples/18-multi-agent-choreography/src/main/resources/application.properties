quarkus.application.name=multi-agent-choreography

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Every consumer route in this choreography reads its topic from the beginning when its group
# is new, exactly like every other consumer route in this book.
camel.component.kafka.auto-offset-reset=earliest

shipping.consumer.group-id=shipping-choreography
notification.consumer.group-id=notification-choreography

# Demo code: this chapter's one negative witness. true makes the Camel filter() in
# ShippingEventRoutes silently drop every ShipmentScheduled event instead of publishing it, so
# the notification agent never wakes. false (the default) is the whole point of this chapter:
# every hop actually reaches the next agent. See ShipmentScheduledDropGuard.
choreography.drop-shipment-scheduled=false

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (orders.orders, shipping.shipments, notifications.notifications), so no
# currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

# One Flyway history against three schemas: this one Quarkus app owns the order, shipping and
# notification agents, so it migrates all three (examples/_infra/postgres/init/01-schemas.sql
# already creates the schemas against the shared compose database; Flyway creates them itself
# against the Dev Services database Quarkus tests use).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders,shipping,notifications
quarkus.flyway.default-schema=orders

# Ollama: the direct quarkus-langchain4j-ollama path (not the Camel langchain4j-agent
# component), three times over. Each agent's own *.agent.model-source picks the decision path:
# "ollama" lets its AiService call the real model and its own tool; "fixture" (MODEL=off, forced
# below for tests) calls the same tool directly (or, for the shipping agent, replays a committed
# recorded decision), so mvn -B verify and CI never need a model. The live verify.sh always runs
# with every *.agent.model-source=ollama, the pinned qwen3 model.
order.agent.model-source=ollama
shipping.agent.model-source=ollama
notification.agent.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by
# default: see _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests never call Ollama: MODEL=off, every agent's step reads the committed fixture or calls its
# tool directly instead (see the *AgentBean, *Advisor and *FixtureAdvisor classes per package).
%test.order.agent.model-source=fixture
%test.shipping.agent.model-source=fixture
%test.notification.agent.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
