quarkus.application.name=consuming-the-async-side

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# The delivered-shipment topic is read from the beginning when the consumer's group is new,
# exactly like every other consumer route in this book.
camel.component.kafka.auto-offset-reset=earliest

# Demo code: false stops the apa.shipping.delivered consumer route entirely, so a delivered event
# sits unconsumed instead of composing and recording a notification. true (the default) is the
# whole point of this chapter: the service reacts to the async side of the API surface the instant
# the event arrives, instead of a dashboard polling apa.shipping.delivered for the same fact.
consumer.async.enabled=true
consumer.async.group-id=consuming-the-async-side

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (notify.notifications), so no currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
# This example owns no other tables in the shared apa database, so it keeps its Flyway history
# isolated in its own schema rather than the default public one, the same discipline
# 24-langchain4j-programmatic-consumer uses for its `consumer` schema.
quarkus.flyway.schemas=notify
quarkus.flyway.default-schema=notify

# Ollama: the direct quarkus-langchain4j-ollama path (not the Camel langchain4j-agent
# component). agent.notification.model-source picks the message path: "ollama" lets the real
# model's NotificationComposerAgent write the customer-facing prose; "fixture" (MODEL=off,
# forced below for tests) replays a deterministic templated message from FixtureComposer instead,
# so mvn -B verify and CI never need a model. The live verify.sh always runs with
# agent.notification.model-source=ollama, the pinned qwen3 model. Either path's message text is
# stored but never asserted on: the structured fields recorded alongside it (order id, customer
# id, event type) come from the event itself, not from the model.
agent.notification.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by
# default: see _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests never call Ollama: MODEL=off, the agent step reads FixtureComposer's deterministic
# template instead (see NotificationBean, FixtureComposer).
%test.agent.notification.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
