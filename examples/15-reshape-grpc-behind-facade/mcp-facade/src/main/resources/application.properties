quarkus.application.name=mcp-facade

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# The gRPC channel to the separate payment-service image, reached by its compose service name on
# its default separate-server port (9000, see that module's application.properties). Plain text:
# both containers share the private apa network and no TLS material is provisioned for this
# teaching example.
quarkus.grpc.clients.payment-service.host=${PAYMENT_SERVICE_GRPC_HOST:payment-service}
quarkus.grpc.clients.payment-service.port=${PAYMENT_SERVICE_GRPC_PORT:9000}
quarkus.grpc.clients.payment-service.plain-text=true

# The MCP tool surface: Streamable HTTP at the quarkus-mcp-server-http default root path (/mcp),
# confirmed live at ch12 and recorded in _plans/versions.md. stdio is how an agent's own process
# consumes this example directly (java -jar, attached to a terminal); it needs no HTTP-reachable
# port. The compose container runs detached (-d), so it has no stdin attached:
# quarkus-mcp-server-stdio's reader hits immediate EOF there and shuts the application down a few
# seconds after start. Disabled only in prod mode, where the container is the compose service;
# stdio stays enabled (the extension default) for a direct, attached `java -jar` run.
%prod.quarkus.mcp.server.stdio.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
