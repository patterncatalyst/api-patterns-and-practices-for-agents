quarkus.application.name=traffic-and-resource-guardrails

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand image,
# which needs its own entrypoint and is not Dev-Services-compatible). Dev Services (tests) runs
# the plain postgres image at the same minor instead.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=trafficguardrails
quarkus.flyway.default-schema=trafficguardrails

# Guardrail 1: the rate limit itself is literal on IngestResource.ingestOrder's @RateLimit
# annotation (value=5, window=30s), not read from configuration; MicroProfile Fault Tolerance
# annotation members are compile-time constants. The negative witness overrides the limit
# globally at runtime instead, through SmallRye Fault Tolerance's own configuration mechanism:
# quarkus.fault-tolerance.global.rate-limit.value / .window (QUARKUS_FAULT_TOLERANCE_GLOBAL_
# RATE_LIMIT_VALUE / _WINDOW as environment variables), left at their defaults here so the
# annotation's own numbers govern every normal run.

# Guardrail 2: the schema-validity ingest gate. schema.gate.enabled=false (demo code,
# SCHEMA_GATE_ENABLED in compose) is the second negative witness: IngestResource skips the
# direct:validate-ingest call entirely, so an invalid payload is accepted instead of rejected.
schema.gate.enabled=true
# Relative path resolves to the repo-root contracts/ directory in dev and test (the working
# directory is this module); in prod the path is absolute, resolved inside the container against
# the bind-mounted contracts/ directory (see compose.yaml). IngestSchemaValidationRoute prefixes
# this with file: when it builds the json-validator endpoint URI.
ingest.schema.path=../../contracts/36-ingest.schema.json
%prod.ingest.schema.path=${INGEST_SCHEMA_PATH:/deployments/contracts/36-ingest.schema.json}
