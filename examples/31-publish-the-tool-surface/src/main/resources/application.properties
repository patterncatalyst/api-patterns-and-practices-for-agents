quarkus.application.name=publish-the-tool-surface

# The single source of truth for the version: Maven's ${project.version}, compiled into the jar
# as quarkus.application.version. quarkus.mcp.server.server-info.version is a real runtime config
# key (confirmed against the quarkus-mcp-server-core 2.0.4 jar's quarkus-config-doc metadata:
# property quarkus.mcp.server.server-info.version, env QUARKUS_MCP_SERVER_SERVER_INFO_VERSION),
# so it is set here explicitly instead of leaning on quarkus-mcp-server's own fallback to
# quarkus.application.version when server-info.version is absent. The same expression is what
# ToolSurfaceMetadata reads for /llms.txt, so both surfaces resolve the one property.
quarkus.mcp.server.server-info.version=${quarkus.application.version}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# The MCP tool surface: Streamable HTTP at the quarkus-mcp-server-http default root path (/mcp)
# is what a network caller, and the live run, reach. stdio carries the SAME tools over
# stdin/stdout for a directly attached `java -jar` or `docker run -i` consumer; a detached
# container has no stdin attached, so stdio there would read immediate EOF and shut the
# application down a few seconds after start. stdio is disabled only in prod mode, where the
# container is the detached compose service; the environment variable
# QUARKUS_MCP_SERVER_STDIO_ENABLED=true overrides that per invocation (environment variables take
# priority over a profile-specific properties-file value), which is how a `docker run -i` one-shot
# against the SAME image turns stdio back on without a second build.
%prod.quarkus.mcp.server.stdio.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
