quarkus.application.name=human-in-the-loop-gate

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# The decisions consumer reads from the beginning when its group is new, exactly like every
# other consumer route in this book.
camel.component.kafka.auto-offset-reset=earliest
cancelgate.decisions.group-id=cancel-gate-decisions

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (orders.cancel_gate, orders.cancel_execution_log, payments.payments), so no
# currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

# This chapter spans Order and Payment (two schemas, the same cancel-and-refund pair ch11's
# saga updates), plus the gate's own two tables, kept in orders. Flyway manages both schemas
# from one migration set, with its own history table living in orders.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders,payments
quarkus.flyway.default-schema=orders

# Ollama: the direct quarkus-langchain4j-ollama path (not the Camel langchain4j-agent
# component). agent.cancelgate.model-source picks the decision path: "ollama" lets the real
# model classify the stated reason and call the one tool itself; "fixture" (MODEL=off, forced
# below for tests) replays a committed, recorded classification from
# fixtures/cancel-reason-overrides.jsonl and calls the same tool directly, so mvn -B verify and
# CI never need a model. The live verify.sh always runs with agent.cancelgate.model-source=ollama,
# the pinned qwen3 model. Either path reaches the same CancelProposalTool.proposeCancelAndRefund,
# so the gate it opens (and the pending-decision event it publishes) is identical whichever path
# produced the classification.
agent.cancelgate.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by default:
# see _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests never call Ollama: MODEL=off, the agent step reads the committed fixture instead (see
# CancelProposalAdvisor, FixtureCancelAdvisor, fixtures/cancel-reason-overrides.jsonl). The
# order-existence and cancellability checks run before the agent is ever called, so the 404/409
# negative cases stay model-independent on both the fixture and the ollama path.
%test.agent.cancelgate.model-source=fixture

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
