# ollama-nodeport.yaml - the Service for Ollama (../../setup-ollama.sh owns
# the Deployment). `port: 11434` matches the container's own listening port
# AND the host port, so there is nothing to decouple here, unlike Keycloak
# or Apicurio.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: apa-data
  labels:
    app.kubernetes.io/name: ollama
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 31143
