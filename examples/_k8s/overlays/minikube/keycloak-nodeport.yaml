# keycloak-nodeport.yaml - the Service for Keycloak
# (../../setup-keycloak.sh owns the Deployment). `port: 8080` matches the
# container's own listening port, so base/config.yaml's
# QUARKUS_OIDC_AUTH_SERVER_URL (keycloak.apa-data.svc.cluster.local:8080)
# resolves correctly; the host port (8180) is a separate number, set only by
# the `nodePort` below plus minikube's --ports publish mapping.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: apa-data
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30818
