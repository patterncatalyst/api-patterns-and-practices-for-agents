# service.yaml - ClusterIP, matching ../../../../base/app-template.yaml's default convention: this
# service has no host-facing tool surface of its own (it reacts to a Kafka event, not a host
# caller), so it stays in-cluster. The setup chapter's verify.sh reaches the platform's own
# NodePorts (Kafka, PostgreSQL, Grafana) instead of this app directly; the Service exists for
# in-cluster callers and for `kubectl exec` from a debug pod, never from the host.
apiVersion: v1
kind: Service
metadata:
  name: event-triggered-agent-wakeup
  namespace: apa
  labels:
    app.kubernetes.io/name: event-triggered-agent-wakeup
    app.kubernetes.io/part-of: apa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: event-triggered-agent-wakeup
  ports:
    - name: http
      port: 8080
      targetPort: http
