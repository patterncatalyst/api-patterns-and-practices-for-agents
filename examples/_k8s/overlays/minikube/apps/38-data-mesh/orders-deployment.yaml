# orders-deployment.yaml - the orders data product: examples/13-package-api-as-mcp-tools, reused
# unchanged, owning the "orders" database (orders, payments and shipping schemas, all read-only
# here) in the one CNPG cluster. Domain ownership (Dehghani principle 1): no other product's
# Deployment points at this database.
#
# Image: built and loaded by ../../../../load-images.sh as
# localhost/apa/13-package-api-as-mcp-tools:1.0.0, never pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: apa
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: apa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: apa
    spec:
      containers:
        - name: orders
          image: localhost/apa/13-package-api-as-mcp-tools:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: apa-app-config
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: apa-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apa-postgres-app
                  key: password
            # Overrides base/config.yaml's shared default (the "apa" database): this product owns
            # its own database, created idempotently by examples/38-*/verify.sh before the mesh
            # deploys.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://apa-postgres-rw.apa-data.svc.cluster.local:5432/orders"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
