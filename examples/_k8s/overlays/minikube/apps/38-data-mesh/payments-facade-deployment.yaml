# payments-facade-deployment.yaml - the payments data product's agent-facing output port:
# examples/15-reshape-grpc-behind-facade/mcp-facade, reused unchanged. Holds no database of its
# own (payment state lives behind the gRPC call, in payment-service's own "payments" database);
# PAYMENT_SERVICE_GRPC_HOST/PORT point the facade's gRPC client at payment-service's in-cluster
# Service instead of the compose service-name default of the same names.
#
# Image: built and loaded by ../../../../load-images.sh as
# localhost/apa/15-reshape-grpc-behind-facade-mcp-facade:1.0.0, never pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-facade
  namespace: apa
  labels:
    app.kubernetes.io/name: payments-facade
    app.kubernetes.io/part-of: apa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-facade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-facade
        app.kubernetes.io/part-of: apa
    spec:
      containers:
        - name: payments-facade
          image: localhost/apa/15-reshape-grpc-behind-facade-mcp-facade:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: apa-app-config
          env:
            - name: PAYMENT_SERVICE_GRPC_HOST
              value: "payment-service"
            - name: PAYMENT_SERVICE_GRPC_PORT
              value: "9000"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
