# shipping-track-service.yaml - the shipping data product's one host-facing output port: the
# "shipping" named MCP server at /mcp/shipping. NodePort, matching examples/_k8s/lib/endpoints.sh's
# "shipping-track" row: host 127.0.0.1:8090, nodePort 30390.
apiVersion: v1
kind: Service
metadata:
  name: shipping-track
  namespace: apa
  labels:
    app.kubernetes.io/name: shipping-track
    app.kubernetes.io/part-of: apa
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: shipping-track
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30390
