# payments-facade-service.yaml - the payments data product's one host-facing output port: MCP
# Streamable HTTP at /mcp. NodePort, matching examples/_k8s/lib/endpoints.sh's "payments" row:
# host 127.0.0.1:8089, nodePort 30389.
apiVersion: v1
kind: Service
metadata:
  name: payments-facade
  namespace: apa
  labels:
    app.kubernetes.io/name: payments-facade
    app.kubernetes.io/part-of: apa
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payments-facade
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30389
