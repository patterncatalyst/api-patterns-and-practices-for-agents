quarkus.application.name=decision-rule-review

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
# This example owns no other tables in the shared apa database, so it keeps its Flyway history
# isolated in its own schema, the same discipline ch24's `consumer` and ch25's `notify` schemas use.
quarkus.flyway.schemas=review
quarkus.flyway.default-schema=review

# The decision rule as data: DecisionRuleReviewer reads this committed JSON file once at startup
# and never calls a model. review.rule.path is demo code, like ch24's MCP_APA_ORDERS_URL and
# ch25's CONSUMER_ASYNC_ENABLED: the live verify.sh points it at the weakened variant
# (contracts/26-refund-review-rule.weakened.json, the amount-ceiling clause removed) for the
# negative witness, then restores it. In dev and test, mvn runs with this module as the working
# directory, so the relative path resolves straight to the repo-root contracts/ directory; in prod
# the path is absolute, resolved inside the container against the bind-mounted contracts/ directory
# compose.yaml wires up (see REVIEW_RULE_PATH there).
review.rule.path=../../contracts/26-refund-review-rule.json
%prod.review.rule.path=${REVIEW_RULE_PATH:/deployments/contracts/26-refund-review-rule.json}

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
