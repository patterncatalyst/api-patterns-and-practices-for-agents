name: apa-26

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  app:
    build:
      context: ..
      dockerfile: 26-decision-rule-review/Containerfile
    container_name: apa-decision-rule-review
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
      # Demo code: the negative witness. Left at its default, the reviewer reads the real
      # committed rule, amount-ceiling clause intact. Pointed at the weakened variant (the same
      # rule with that clause removed), the SAME violating proposal is approved instead of
      # rejected, proving the clause is exactly what caught it.
      REVIEW_RULE_PATH: ${REVIEW_RULE_PATH:-/deployments/contracts/26-refund-review-rule.json}
    volumes:
      # Both rule files, read-only: the committed decision rule this chapter is about, and the
      # weakened variant the negative witness swaps in by overriding REVIEW_RULE_PATH above.
      - ../../contracts:/deployments/contracts:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
