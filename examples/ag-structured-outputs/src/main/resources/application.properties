quarkus.application.name=ag-structured-outputs

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# TypedIntentExtractor and UntypedIntentExtractor share this one unnamed Ollama chat model: same
# model, same temperature, same system message. quarkus-langchain4j-ollama 1.13.4 always advertises
# the RESPONSE_FORMAT_JSON_SCHEMA model capability (confirmed against the resolved jar's
# OllamaRecorder, not quarkus_searchDocs, which does not index this extension); langchain4j's
# AiServices machinery derives a JSON Schema from a method's declared return type and attaches it
# as that one request's response format whenever the model declares that capability and the return
# type is not String/Result/TokenStream, so only TypedIntentExtractor's calls ever carry a
# schema-constrained Ollama "format": the model configuration below never changes between the two
# paths. quarkus.langchain4j.ollama.chat-model.format (unset here) is a separate, static per-bean
# override for a fixed format string, not used by either path in this appendix.
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# TypedIntentExtractor.extract additionally carries a JsonExtractorOutputGuardrail, a second,
# weaker safety net behind Ollama's own grammar-constrained decoding: a retry-on-parse-failure loop
# for the rare response the grammar still lets through malformed, up to this many attempts before
# the call gives up and throws OutputGuardrailException. Confirmed against the resolved
# quarkus-langchain4j-core 1.13.4 jar's GuardrailsConfig: the real default is 3.
quarkus.langchain4j.guardrails.max-retries=3

# agent.extraction.model-source picks the decision path: "ollama" (the default, and what compose
# and the live verify.sh always use) calls the real model through both AiServices above; "fixture"
# (forced by the %test profile, MODEL=off) returns a canned response instead, through
# FixtureIntentSource, so mvn -B verify and CI never need Ollama.
agent.extraction.model-source=ollama
%test.agent.extraction.model-source=fixture

# agent.extraction.structured-output-enabled is the negative witness' own switch: true (the
# default) routes /extract/typed through TypedIntentExtractor, the Ollama-format-constrained path;
# false routes that same endpoint through UntypedIntentExtractor instead and runs the identical
# strict parse /extract/untyped always runs, so the one endpoint that is supposed to guarantee a
# parseable shape can be shown breaking once its own schema constraint is turned off.
agent.extraction.structured-output-enabled=true

%test.quarkus.otel.sdk.disabled=true
