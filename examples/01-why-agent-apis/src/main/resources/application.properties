quarkus.application.name=why-agent-apis

quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.timeout=120s
# This run is recorded once and replayed from a committed fixture (see README); a low
# temperature and a fixed seed keep a LIVE re-run as close to the recorded transcript as
# qwen3's tool calling allows.
quarkus.langchain4j.ollama.chat-model.temperature=0.0
quarkus.langchain4j.ollama.chat-model.seed=42

# Tests exercise OrderOpsService and the tool classes directly (see WhyAgentApisTest), never
# the assistant, so Ollama Dev Services (which would try to pull a model) stays off.
%test.quarkus.langchain4j.ollama.devservices.enabled=false
