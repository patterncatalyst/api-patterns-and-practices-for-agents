name: apa-20

include:
  - path: ../_infra/compose.yaml
  - path: ../_infra/compose.lgtm.yaml

services:
  app:
    build:
      context: ..
      dockerfile: 20-long-running-agent-workflow/Containerfile
    container_name: apa-long-running-agent-workflow
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/apa
      QUARKUS_DATASOURCE_USERNAME: apa
      QUARKUS_DATASOURCE_PASSWORD: apa
      QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL: http://ollama:11434
      # Demo code: amounts at or above this limit are declined by the payment step.
      FULFILLMENT_PAYMENT_DECLINE_ABOVE: ${PAYMENT_DECLINE_ABOVE:-500.00}
      # Demo code: false disables every compensation method (the negative witness in verify.sh),
      # so the reserved stock is never given back after a declined payment.
      FULFILLMENT_COMPENSATION_ENABLED: ${COMPENSATE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [apa]

networks:
  apa:
    name: apa
