quarkus.application.name=long-running-agent-workflow

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand image,
# which needs its own entrypoint and is not Dev-Services-compatible). Dev Services (tests) runs the
# plain postgres image at the same 18.6 minor instead. Every statement is schema-qualified, so no
# currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders,inventory,payments,shipping
quarkus.flyway.default-schema=orders

# Demo code: the saga's time limit. The sweeper-free in-memory coordinator compensates
# automatically if the saga has not completed within this duration.
fulfillment.saga.timeout=PT30S

# Demo code: amounts at or above this limit are declined by the payment step, driving the
# mid-saga failure verify.sh demonstrates. PAYMENT_DECLINE_ABOVE in compose.
fulfillment.payment.decline-above=500.00

# Demo code: false (the negative witness, COMPENSATE in compose) turns every compensation method
# in FulfillmentService into a no-op, so a step's effect survives a later step's failure instead
# of being undone.
fulfillment.compensation.enabled=true

# Ollama: the direct quarkus-langchain4j-ollama path (not the Camel langchain4j-agent component).
# agent.carrier.model-source picks the decision path: "ollama" lets the CarrierAdvisor AiService
# call the real model and its bookCarrier tool; "fixture" (MODEL=off, forced below for tests)
# replays a committed, recorded decision from fixtures/carrier-decisions.jsonl and calls the same
# tool directly, so mvn -B verify and CI never need a model. The live verify.sh always runs with
# agent.carrier.model-source=ollama, the pinned qwen3 model.
agent.carrier.model-source=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b-instruct-2507-q4_K_M
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=120s
# OTel GenAI content capture (prompts/completions in span attributes) stays off by
# default: see _plans/versions.md, "OTel GenAI semantic conventions".
%test.quarkus.langchain4j.ollama.devservices.enabled=false

# Tests never call Ollama: MODEL=off, the agent step reads the committed fixture instead
# (see CarrierDecisionBean, FixtureCarrierAdvisor, fixtures/carrier-decisions.jsonl). The saga
# timeout is shortened so a test that deliberately waits it out does not run long.
%test.agent.carrier.model-source=fixture
%test.fulfillment.saga.timeout=PT5S

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
