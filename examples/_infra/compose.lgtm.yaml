name: apa-lgtm

# Grafana LGTM (Loki, Grafana, Tempo, Mimir) with an OpenTelemetry collector,
# started separately from compose.yaml so observability can come up or go
# down without disturbing the application infrastructure.
#
# No example references this stack yet (r01).
services:
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.41.0
    container_name: apa-lgtm
    ports:
      - "127.0.0.1:3000:3000"     # Grafana
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:19090:9090"    # Prometheus (host 9090 is commonly taken by Cockpit on Fedora/RHEL)
      - "127.0.0.1:3200:3200"     # Tempo API
      - "127.0.0.1:3100:3100"     # Loki API
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    networks:
      - apa

networks:
  apa:
    name: apa
