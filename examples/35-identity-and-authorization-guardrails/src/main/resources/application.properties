quarkus.application.name=identity-and-authorization-guardrails

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# PostgreSQL: compose points this at the apa-postgres container (the CloudNativePG operand
# image, which needs its own entrypoint and is not Dev-Services-compatible). Dev Services
# (tests) runs the plain postgres image at the same 18.6 minor instead. Every statement is
# schema-qualified (orders.orders), so no currentSchema/search_path is set here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/apa}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:apa}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:apa}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.flyway.default-schema=orders

# The MCP tool surface: Streamable HTTP at the quarkus-mcp-server-http default root path (/mcp).
# stdio is how an agent's own process consumes this example directly (java -jar, attached to a
# terminal); the compose container runs detached (-d), so it has no stdin attached and the stdio
# reader's immediate EOF would otherwise shut the application down a few seconds after start.
# Disabled only in prod mode, carrying forward the securing-and-gating fix.
%prod.quarkus.mcp.server.stdio.enabled=false

# OIDC bearer on /mcp: the r02 `apa` realm (examples/_infra/keycloak/realm-apa.json), additively
# extended here with a confidential, standard-token-exchange-enabled requester client
# (apa-agent-bff) and a step-up-acr client scope; every client, role and scope the securing-
# and-gating example depends on is untouched. apa-mcp is the confidential, client_credentials
# (service account) client this app verifies its callers against. client-id is optional for local
# JWT verification but set anyway: it names the client in verification-failure logs.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=apa-mcp
quarkus.oidc.credentials.secret=apa-mcp-dev-secret
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak:8080/realms/apa}
# Keycloak is reachable at two URLs: the app discovers metadata and JWKS over the compose network
# (keycloak:8080), but callers fetch tokens over the published URL (localhost:8180), so the token's
# `iss` claim is the published URL. Pin the expected issuer to that published value; the internal
# auth-server-url above is only used for connectivity, not as the expected issuer.
%prod.quarkus.oidc.token.issuer=${QUARKUS_OIDC_TOKEN_ISSUER:http://localhost:8180/realms/apa}

# The whole /mcp endpoint requires an authenticated caller, not just the individual tool methods
# that carry @RolesAllowed: an unauthenticated initialize or tools/list over /mcp is rejected at
# the HTTP layer before the MCP dispatcher runs. @RolesAllowed("agent") underneath is still the
# second gate: which authenticated caller may invoke which tool. The scope and acr checks inside
# cancelOrder are a third and fourth gate, checked by hand against the JsonWebToken.
quarkus.http.auth.permission.mcp.paths=/mcp
quarkus.http.auth.permission.mcp.policy=authenticated

# The step-up acr floor cancelOrder enforces. STEPUP_ENFORCED=false is the negative-witness knob:
# it disables only this check (the write-scope check is a separate axis and always runs), so a
# live run can recreate the app with it unset and watch a low-acr token reach the mutation it
# could not reach before.
guardrails.step-up.enforced=${STEPUP_ENFORCED:true}

# Tests simulate the caller's identity, scope and acr with @TestSecurity/@OidcSecurity (see
# OrderMcpToolsTest) and never contact a real IdP. Leaving quarkus.oidc.auth-server-url unset
# outside %prod would otherwise auto-start Dev Services for Keycloak, a real Keycloak
# testcontainer this example's tests must not need; disabling the tenant for %test is the
# documented way to keep that from happening.
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
